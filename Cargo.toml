[workspace]
resolver = "3"
members = ["crates/*"]
# Plugins are separate builds, not workspace members: they target `wasm32-wasip2` and must not
# inherit the workspace's dependency versions or lints — a plugin is meant to be buildable by
# someone who has only the WIT file.
exclude = ["plugins/*"]

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/bitknox/anistream"

[workspace.dependencies]
# --- internal ---
anistream-core = { path = "crates/anistream-core" }
anistream-net = { path = "crates/anistream-net" }
anistream-meta = { path = "crates/anistream-meta" }
anistream-model = { path = "crates/anistream-model" }
anistream-engine = { path = "crates/anistream-engine" }
anistream-player = { path = "crates/anistream-player" }
anistream-plugin = { path = "crates/anistream-plugin", default-features = false }
anistream-plugin-store = { path = "crates/anistream-plugin-store" }
anistream-store-core = { path = "crates/anistream-store-core" }
anistream-store-server = { path = "crates/anistream-store-server" }
anistream-store-wasm = { path = "crates/anistream-store-wasm" }
anistream-providers = { path = "crates/anistream-providers" }
anistream-store = { path = "crates/anistream-store" }
anistream-track = { path = "crates/anistream-track" }
anistream-testkit = { path = "crates/anistream-testkit" }
anistream-ui = { path = "crates/anistream-tui" }

# --- async ---
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "net", "io-util", "signal"] }
async-trait = "0.1"
futures = "0.3"

# --- errors / logging ---
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# --- serde ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
# Format-preserving TOML, so writing one setting from the UI does not rewrite the user's whole
# config file and discard their comments.
toml_edit = "0.25"

# --- http ---
# wreq: browser TLS/JA3/JA4 + HTTP2 fingerprint emulation. Required for Cloudflare-fronted
# providers; a correct browser header set alone returns 403.
wreq = { version = "5.3", features = ["json", "gzip", "brotli", "deflate", "cookies", "socks"] }
wreq-util = "2"
# reqwest: plain client for hosts that need no emulation (AniList, its image CDN, GitHub raw).
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "form", "rustls", "webpki-roots", "http2", "gzip", "brotli", "stream", "socks"] }

# --- storage ---
rusqlite = { version = "0.40", features = ["bundled", "chrono", "serde_json"] }

# --- tui ---
ratatui = "0.30"
# Local-timezone day boundaries for the calendar's rulings. Already in the tree via
# rusqlite's feature, so this costs nothing new.
chrono = "0.4"
# default-features off: the `chafa-dyn` default pulls in the chafa C library via
# pkg-config, which every Kitty/Sixel/iTerm2 protocol works without. It only adds a
# higher-quality symbol fallback, so it stays an opt-in feature rather than a build
# requirement on every machine.
ratatui-image = { version = "11.0", default-features = false, features = ["crossterm", "tokio"] }
crossterm = { version = "0.29", features = ["event-stream"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
terminal-colorsaurus = "1.0"

# --- matching / parsing ---
nucleo = "0.5"

# --- foreign function interface ---
# The bindings native front ends are generated with. Pinned exactly: the bindings and the library's
# scaffolding have to come from the same release, and the generated Swift and Kotlin check the
# library's contract version and checksums when they load it. Without its defaults, which only
# the bindings generator needs.
uniffi = { version = "=0.32.2", default-features = false }

# --- platform ---
directories = "6"
clap = { version = "4", features = ["derive", "env"] }
jiff = { version = "0.2", features = ["serde"] }
# Opens a URL in the system handler — the licensed-source handoff, since Crunchyroll's
# Widevine streams cannot be decoded locally.
open = "5"

# Line tables are enough for a backtrace through a dependency; full debug info for ~650 crates
# mostly costs link time across a dozen test binaries, and disk. Workspace crates keep it.
[profile.dev.package."*"]
debug = "line-tables-only"

# The wasm compiler runs inside debug test binaries: an unoptimised Cranelift spends 18 s on the
# JavaScript plugin that an optimised one compiles in about one, and the conformance tests that
# load it saturate every core while they do. Optimising only the compiler keeps the rest of the
# dev build fast to compile and debuggable.
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.cranelift-entity]
opt-level = 3
[profile.dev.package.cranelift-bforest]
opt-level = 3
[profile.dev.package.cranelift-bitset]
opt-level = 3
[profile.dev.package.cranelift-control]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3
[profile.dev.package.wasmtime-environ]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
