[package]
name = "anistream-plugin-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Plugin stores: the invite-and-token protocol, the client, and the reference server"

[lib]
# No doc example is written as a test, and rustdoc spends seconds per crate finding none.
doctest = false

[dependencies]
anistream-store-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
async-trait.workspace = true
# The client side. A store is a server someone runs for their friends, so there is nothing to
# emulate and the plain client is the right one.
reqwest.workspace = true
rusqlite.workspace = true
url = "2"
# The reference server. Five routes do not need a framework, and hyper is already in the tree.
hyper = { version = "1.11", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
# TLS for a server that terminates it itself, with the provider rustls already builds.
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls-pki-types = { version = "1.15", features = ["std"] }
# Postgres, for platforms with a database and no disk.
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.13"
webpki-roots = "1"

[dev-dependencies]
tempfile = "3"
anistream-store-core = { workspace = true, features = ["testing"] }

[lints]
workspace = true
