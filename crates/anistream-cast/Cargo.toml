[package]
name = "anistream-cast"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Casting to TVs with Chromecast built in: the Cast v2 channel, the LAN relay, codec plans, MKV to HLS with AAC audio, and ASS to WebVTT"
publish = false

[lib]
doctest = false

[features]
default = []
# A Cast receiver on loopback, for the tests of whatever drives one: the engine's turn it on as a
# dev-dependency. Never on in a build that ships.
fake = []

[dependencies]
# What a player reports, as the session reads it: a cast reports in the same words.
anistream-playback.workspace = true
async-trait.workspace = true
futures.workspace = true
tokio.workspace = true
# The Cast channel is TLS to the receiver's self-signed certificate, on ring as the remote's TLS
# is. TLS 1.2 too: older Chromecasts offer nothing newer.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# The relay's per-cast token and the sender's id on the channel.
rand = "0.10"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
