[package]
name = "anistream-store-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The plugin store compiled to WebAssembly, for Workers and serverless functions"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
anistream-store-core.workspace = true
async-trait.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[package.metadata.wasm-pack.profile.release]
# Size over speed: a Worker's script has a size limit, and the store does little arithmetic.
wasm-opt = ["-Oz"]

[lints]
workspace = true
