[package]
name = "anistream-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Test kit: a fake AniList, fixture titles and store seeding"
# Only ever a dev-dependency. It stands in for a network service, which nothing outside a test
# should be able to build against by accident.
publish = false

[lib]
# No doc example is written as a test, and rustdoc spends seconds per crate finding none.
doctest = false

# Kept below the app and the terminal front end on purpose: both are to test against it, so it
# can depend on neither.
[dependencies]
anistream-core.workspace = true
anistream-meta.workspace = true
anistream-net.workspace = true
anistream-providers.workspace = true
anistream-store.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
