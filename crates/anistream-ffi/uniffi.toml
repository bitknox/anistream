# How UniFFI's bindings name this crate for each language, read from here when the bindings are
# generated from the engine's library. Swift keeps its defaults: the module is the crate's name, as
# the Apple app imports it.

[bindings.kotlin]
# Every crate's bindings under one package, a package each, so an Android app imports the engine
# from `tv.anistream.engine` and nothing clashes with the app's own.
package_name = "tv.anistream.engine.ffi"
# Android's own APIs where there are both: the library loaded as Android loads one.
android = true

[bindings.csharp]
# The Windows app's namespaces, one per crate as for Kotlin, public so the app's own projects can
# use the types the Anistream.Engine project compiles.
namespace = "Anistream.Engine.Ffi"
access_modifier = "public"
