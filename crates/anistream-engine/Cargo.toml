[package]
name = "anistream-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The work behind anistream's front ends: playback, sources, sync, downloads and background jobs"
publish = false

[lib]
# No doc example is written as a test, and rustdoc spends seconds per crate finding none.
doctest = false

# No terminal crate, not even transitively, and not the terminal front end: the engine runs under
# front ends that are not a terminal. tools/check-boundaries.sh holds it to that in CI.
[features]
default = ["desktop"]
# What a desktop has and a phone has not: the Discord presence (also `presence` alone), the mpv
# child process each playback runs, the Syncplay
# party a play can be handed to, the browser redirect AniList and MyAnimeList sign in through,
# notifications through osascript and notify-send, pmset's word on the battery, and the OS
# keychain through `keyring`. Without it none of these is built, nor are `anistream-player`,
# `open` and `keyring`. The crate docs say what a front end without it gets instead.
desktop = ["presence", "dep:anistream-player", "dep:open", "anistream-track/keychain"]
# The Discord presence an episode shows while it plays, and nothing else of the desktop: the Mac
# app turns it on beside `--no-default-features`, with no mpv child process. A phone's build
# leaves it off, and its front end is told so (`SettingsView::presence_available`).
presence = ["dep:anistream-discord"]
# What a test stands the engine up with instead of what it builds, and what only a test wants to
# hear from it: see `options::Parts` and `engine::Traced`. Never on in a build that ships: the
# binary turns it on for its own tests alone, as a dev-dependency.
testing = []

[dependencies]
anistream-core.workspace = true
anistream-meta.workspace = true
anistream-model.workspace = true
anistream-net.workspace = true
anistream-discord = { workspace = true, optional = true }
anistream-player = { workspace = true, optional = true }
# The pure half of playback, which the session drives any player with: the policy, the tracks,
# skips, and what a player reports and is shown. Allowed in a phone's build.
anistream-playback.workspace = true
anistream-plugin = { workspace = true, features = ["fetch"] }
anistream-plugin-store.workspace = true
anistream-store-server.workspace = true
anistream-providers.workspace = true
anistream-store.workspace = true
anistream-track.workspace = true
open = { workspace = true, optional = true }
async-trait.workspace = true
thiserror.workspace = true
futures.workspace = true
image.workspace = true
# When an episode yet to air airs, said in the reader's own zone.
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
# Random tokens for the mending proxy's loopback path.
rand = "0.10"
# Named by the mending proxy, whose upstream requests go through `HttpClient::emulated`.
wreq.workspace = true

# What is free on the disk downloads land on, which keep next stops short of. Safe statvfs: the
# workspace forbids unsafe code. Already in the tree through wasmtime and tempfile.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
# mend_probe reports what failed through anyhow, and logs what the mender does as it serves.
anyhow.workspace = true
tracing-subscriber.workspace = true
tempfile = "3"
# The fixture titles' schedules, for keep next's tests of what is out.
anistream-testkit.workspace = true

# These play in mpv, or sign in the way only the desktop does.
[[example]]
name = "playback_probe"
required-features = ["desktop"]

[[example]]
name = "kitsu_probe"
required-features = ["desktop"]

[[example]]
name = "mal_probe"
required-features = ["desktop"]

[[example]]
name = "simkl_probe"
required-features = ["desktop"]

[[test]]
name = "binge"
required-features = ["desktop"]

[[test]]
name = "link_golden"
required-features = ["desktop"]

[lints]
workspace = true
