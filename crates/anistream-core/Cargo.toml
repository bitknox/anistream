[package]
name = "anistream-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Domain types, traits and configuration for anistream"

[lib]
# No doc example is written as a test, and rustdoc spends seconds per crate finding none.
doctest = false

[dependencies]
async-trait.workspace = true
directories.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
uniffi = { workspace = true, optional = true }

[features]
# The ids, enums and records of the core's that the model's commands and events carry, as UniFFI
# custom types, enums and records, for a native front end's bindings. Turned on by the model's
# own `ffi` feature: nothing else here crosses, and nothing here needs it.
ffi = ["dep:uniffi"]

[lints]
workspace = true
