[package]
name = "anistream-i18n"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The strings the terminal and Linux apps show, loaded at runtime from the shared Fluent catalogue"
publish = false

[lib]
