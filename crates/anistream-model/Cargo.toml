[package]
name = "anistream-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "What anistream's engine and its front ends say to each other: commands, events, the rows they carry and their words"
# Shared by the workspace's own crates only. Its shape follows the engine, and is not a promise to
# anyone building against it.
publish = false

[lib]
# No doc example is written as a test, and rustdoc spends seconds per crate finding none.
doctest = false

# Plain data and the rules over it, so the core's vocabulary, and UniFFI's derives for the bindings
# only. No runtime, no I/O and no terminal library: tools/check-boundaries.sh holds the last of
# those in CI.
[dependencies]
anistream-core.workspace = true
anistream-i18n.workspace = true
serde.workspace = true
uniffi = { workspace = true, optional = true }

[features]
# The model's types as UniFFI records and enums, for a native front end's bindings, with the core's
# that they carry. Off by default; CI builds it on its own and fails on a type that cannot cross.
ffi = ["dep:uniffi", "anistream-core/ffi"]

[lints]
workspace = true
