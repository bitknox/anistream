[package]
name = "anistream-party"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Watch parties: a Syncplay protocol client that keeps a room of players together"
publish = false

[lib]
# No doc example is written as a test, and rustdoc spends seconds per crate finding none.
doctest = false

# The protocol and its TLS, nothing else: no HTTP stack, no engine, no player. What a player is
# told comes out as `PlayerAction`s, so any front end's player can be driven by it. Every crate
# below is already in the workspace's tree. See docs/party-protocol.md.
[features]
# `fake::FakeServer`: a Syncplay server on the loopback interface with members it scripts, for
# tests and the apps' Fixtures builds. Never in an app's release build.
testing = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
# Syncplay's TLS is STARTTLS on the same port, checked against the web's public roots, on ring as
# the remote's is.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "1"

[lints]
workspace = true
