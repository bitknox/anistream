[package]
name = "anistream-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "HTTP layer: rate limiting and conditional fetches"

[lib]
# No doc example is written as a test, and rustdoc spends seconds per crate finding none.
doctest = false

[dependencies]
anistream-core.workspace = true
reqwest.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
wreq.workspace = true
wreq-util.workspace = true
# The Mozilla roots as certificates, which Android's plain clients trust in place of the
# platform's verifier: see `client::trusted_roots`. Already built for wreq, on every platform.
webpki-root-certs = "1"

[dev-dependencies]
# test-util gives the paused clock, so the rate-limiter tests assert real waits
# without actually sleeping.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }

[lints]
workspace = true
