[package]
name = "anistream-discord"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Discord rich presence over Discord's local IPC socket, and nothing else"
publish = false

[lib]
# No doc example is written as a test, and rustdoc spends seconds per crate finding none.
doctest = false

# Its own crate so that a build with presence and no mpv (the Mac app's) takes the client without
# `anistream-player`, which carries the mpv child process and the opener.
[dependencies]
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }

[lints]
workspace = true
