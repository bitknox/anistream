# Cargo's configuration for every build in the repository: CI's, engine.sh's (whose clean
# environment cargo still applies this to) and anyone's by hand.

[env]
# BoringSSL's libssl, which btls-sys builds for wreq, is C++ and needs the C++ runtime. On Android
# btls-sys links the NDK's shared one (`-lc++`, which is libc++_shared.so), and the app would have
# to ship it. This links it statically instead: `-bundle` makes rustc pass it at the final link
# as `-Bstatic -lc++`, which finds the NDK's libc++.a, INPUT(-lc++_static -lc++abi). Named for the
# two Android targets, arm64 phones and the 32-bit ARM most TV boxes run, so no other build reads
# it. CI's android job and engine.sh check the library needs only libc, libm and libdl.
BORING_BSSL_RUST_CPPLIB_aarch64_linux_android = "static:-bundle=c++"
BORING_BSSL_RUST_CPPLIB_armv7_linux_androideabi = "static:-bundle=c++"

# BoringSSL's aarch64 assembly is GNU-style .S, which MSVC's cl.exe cannot assemble, and the
# Visual Studio generator leaves those objects out (LNK1181). For Windows on Arm the build uses
# clang-cl, which compiles the C and the assembly alike, under Ninja, which honours a compiler
# that is not cl.exe. desktop/windows/scripts/bindings.sh puts Visual Studio's clang-cl and Ninja
# on the PATH; docs/desktop-windows-spike.md has the rest of the toolchain.
CC_aarch64_pc_windows_msvc = "clang-cl"
CXX_aarch64_pc_windows_msvc = "clang-cl"
CMAKE_GENERATOR_aarch64_pc_windows_msvc = "Ninja"
