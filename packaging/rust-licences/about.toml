# What cargo-about accepts among the Rust crates compiled into a release, for
# packaging/rust-licences/generate.sh, and what it has to be told about the crates whose own
# licence files do not say everything. A crate under anything else fails the release, so a new
# licence is a decision rather than a surprise.
#
# Where a crate offers a choice, the first of these it allows is the one listed.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]
ignore-dev-dependencies = true

# wreq-util is GPL-3.0, alone among the crates here, and the browser profiles anistream-net takes
# from it are compiled into the terminal binary and the apps' engine alike. Accepted for this one
# crate, so the notices say so and any other GPL crate still fails.
[wreq-util]
accepted = ["GPL-3.0"]

# MIT itself, and it builds the BoringSSL it vendors into the binary, under BoringSSL's own terms:
# the OpenSSL and SSLeay licences for what came from OpenSSL, ISC for Google's own code.
[boring-sys2.clarify]
license = "MIT AND OpenSSL AND ISC"

[[boring-sys2.clarify.files]]
path = "LICENSE-MIT"
license = "MIT"
checksum = "ad2e7bdef7c00b92eaf4f657a472c7d3f8b36aac3cdc270e65bb0c287eec0d4e"

[[boring-sys2.clarify.files]]
path = "deps/boringssl/LICENSE"
license = "OpenSSL"
checksum = "3c3f6f4f69eeab19a92f3952f7cd8b9b78f9c5c8b0da6f788dbb50f1f60c9515"
end = "[including the GNU Public Licence.]\n */"

[[boring-sys2.clarify.files]]
path = "deps/boringssl/LICENSE"
license = "ISC"
checksum = "1d65b25531c4153575ff604cf4082ed192cd5835b19b6358cb340e6b05528d52"
start = "/* Copyright (c) 2015, Google Inc."

# MIT or Apache-2.0 itself, and it builds the zstd it vendors in, which is BSD-3-Clause.
[zstd-sys.clarify]
