name: Bug report
description: Something in anistream does not work.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Reports from inside the app arrive with the diagnostics below filled in.
        This is a public page: do not paste addresses, file paths, account details or your library here.
  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: What you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: What you did, in order, so it can be repeated.
      placeholder: |
        1. Open ...
        2. Choose ...
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Filled in by the app. It holds versions, your device and the last error, with addresses, paths, tokens and titles removed. Read it before you submit, and edit anything you would rather not share.
      render: text
