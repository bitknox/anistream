# Dependabot's version updates: one pull request a week, every ecosystem in it, majors included.
#
# Every push to main is a release unless it only changes the website, the docs or the Markdown at
# the top (release.yml), so each merged pull request ships one, and each runs CI for half an hour.
# So the week's updates come as one pull request on Monday morning: one CI run, one release.
#
# The `weekly` multi-ecosystem group holds the schedule and every ecosystem below joins it with
# `patterns: ["*"]`: one pull request for all of them, branch dependabot/weekly-<digest>. The
# group-only settings live on the group; Dependabot rejects `open-pull-requests-limit` and
# `commit-message` on an ecosystem in one. Ignores and the cooldown stay with each ecosystem.
#
# What the group cannot hold:
#   security updates, which a multi-ecosystem group never takes. They still come at once, as
#     the repository setting has them, one pull request per ecosystem and directory: the
#     `*-security` groups bundle each ecosystem's. GitHub caps them at 10 open, a limit no
#     setting here changes.
#   a pull request already open: Dependabot refreshes the weekly one, and may open a second
#     instead (dependabot-core#12957). The limit of 1 keeps it to one: a week's updates wait for
#     the last week's to be merged or closed.
#
# There is no rust-toolchain entry: rust-toolchain.toml is moved by hand, together with the
# container's RUST_VERSION and the store's WebAssembly (deploy/sync.sh hashes the toolchain file).
#
# There is no swift entry either. The packages under apple/Packages depend only on each other, by
# path, and the one remote package, MPVKit, is pinned by checksum in apple/scripts/mpv.sh, which
# Dependabot cannot read. The spikes under apple/Spikes and android/Spikes are left out too.
#
# The weekly pull request needs a push from someone before CI passes when it moves either of
# these, since Dependabot runs no build of its own:
#   the admin page's dependencies (crates/anistream-store-core/admin): `bun run build` there, so
#     the committed build matches its source;
#   any dependency the store compiles, the admin page's included: `deploy/sync.sh`, so
#     deploy/store-wasm is current.
version: 2

multi-ecosystem-groups:
  weekly:
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Copenhagen
    # One version-update pull request open at a time, so a backlog never opens a flood.
    open-pull-requests-limit: 1

updates:
  - package-ecosystem: cargo
    directories:
      - /
      - /plugins/example-rust
      - /plugins/test-hostile
    multi-ecosystem-group: weekly
    patterns: ["*"]
    # A release has a week to show a problem before it is proposed. Security updates do not wait.
    cooldown:
      default-days: 7
    groups:
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]

  # The JavaScript reference plugin is built with npm, per docs/plugins.md.
  - package-ecosystem: npm
    directory: /plugins/example-ts
    multi-ecosystem-group: weekly
    patterns: ["*"]
    cooldown:
      default-days: 7
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: bun
    directories:
      - /website
      - /crates/anistream-store-core/admin
      - /deploy/cloudflare
      - /deploy/netlify
      - /deploy/vercel
      - /deploy/test
    multi-ecosystem-group: weekly
    patterns: ["*"]
    cooldown:
      default-days: 7
    ignore:
      # Astro 7.4 needs Node 22.23.4, and Cloudflare Pages builds the website on Node 22.16 unless
      # the project sets NODE_VERSION. Once it does, drop this and widen astro to ^7 in
      # website/package.json.
      - dependency-name: astro
        versions: [">=7.4.0"]
    groups:
      bun-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /android
    multi-ecosystem-group: weekly
    patterns: ["*"]
    cooldown:
      default-days: 7
    groups:
      gradle-security:
        applies-to: security-updates
        patterns: ["*"]

  # The workflows name actions by major tag, so nearly every update here is a major one.
  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: weekly
    patterns: ["*"]
    cooldown:
      default-days: 7
    ignore:
      # gradle/actions 6 moved setup-gradle's caching into a proprietary component, and taking it
      # means accepting Gradle's terms of use (blog.gradle.org/github-actions-for-gradle-v6). Held
      # at 5 until that is decided; drop this to take 6.
      - dependency-name: gradle/actions
        versions: [">=6"]

  - package-ecosystem: docker
    directory: /deploy/container
    multi-ecosystem-group: weekly
    patterns: ["*"]
    cooldown:
      default-days: 7
    ignore:
      # The build stage's rust image follows rust-toolchain.toml, by hand, through RUST_VERSION.
      - dependency-name: rust
