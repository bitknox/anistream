name: Release

# Every push to main is a release, unless all it changes is the website or the docs: the terminal
# binaries built here, the apps apps-release.yml builds, and the plugin store's image, which
# store-image.yml builds once the release is out. Nobody tags by hand. The version is
# packaging/next-version.sh's: the workspace's version in Cargo.toml, or the next patch once that
# version has a release. Each build sets it in its own checkout with packaging/set-version.sh,
# and nothing is committed back.
#
# The release is published only once every build has succeeded, and its tag is made as it is
# published (packaging/publish.sh), so a run that fails leaves neither, and the next push tries
# the same version again. Releases run one at a time, in the order they were pushed. A push that
# comes while one runs waits for it. GitHub keeps only the newest of those waiting, and its
# release carries what the pushes before it changed.
#
# A pushed v* tag is released as it is, with the version it names. A dispatch releases main's
# newest commit if it has no release yet, or, given a tag, builds that tag and publishes it again.
#
# A tag's run can restore only caches saved on that tag or on main. Releases from main save the
# terminal builds' caches, and the schedule builds main every week so that a week without a
# release does not lose them. A pull request that changes how the terminal binaries are built
# builds them, saving and publishing nothing.
on:
  push:
    branches: [main]
    tags: ['v*']
    # A push that changes nothing but these is not released. GitHub applies no path filters to
    # tags, so a pushed tag always is. Only the website, the docs and the Markdown files at the
    # top are left out, since nothing that is built reads them, and every other path can change
    # what a release carries.
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - '*.md'
  # A pull request that would change how a release is built builds it first, saving and
  # publishing nothing, so a release that no longer builds, or no longer starts on older Linux,
  # shows up before the merge rather than on main. One that changes only the dependencies or the
  # toolchain builds Linux alone, for the old-Linux check, since CI compiles and tests the Mac
  # and Windows builds already; a change to the packaging or this workflow builds every target.
  pull_request:
    paths:
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/release.yml
      - packaging/next-version.sh
      - packaging/set-version.sh
      - packaging/apps/version.sh
      - packaging/linux/glibc-floor.sh
      - packaging/rust-licences/**
  # GitHub drops a cache nobody has read for seven days, so a weekly build reads it and keeps it.
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      tag:
        description: A tag to build and publish again, such as v2.0.0. Empty releases main's newest commit, if it has no release yet.
        required: false
        type: string

# One release at a time, and none cancelled once it has started. A newer push to a pull request
# makes its running builds moot, and each scheduled build is a group of its own, so it never
# takes the place of a release waiting its turn.
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request' && format('release-pr-{0}', github.ref)
    || github.event_name == 'schedule' && format('release-schedule-{0}', github.run_id)
    || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # What this run builds and whether it publishes it. Every run has a version, so the builds on a
  # pull request and on the schedule set one too, though they publish nothing.
  version:
    name: The version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      publish: ${{ steps.version.outputs.publish }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      # `inputs.tag` is empty on anything but a dispatch with a tag, and checkout then takes the
      # commit that started the run.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      # The tags without their history: next-version.sh reads their names, and a commit with a
      # release already is found by its tag.
      - name: The release tags
        run: git fetch --force --depth=1 origin '+refs/tags/v*:refs/tags/v*'

      - name: The version script's own tests
        run: packaging/next-version.sh --test

      # A tag pushed or named is released as it is. Otherwise the version is the next one, and a
      # push to main or a dispatch publishes it, unless the commit has a release already, as when
      # a release's run is run again whole.
      - name: The version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PUSHED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          commit="$(git rev-parse HEAD)"
          tag="${INPUT_TAG:-$PUSHED_TAG}"
          publish=false
          if [[ -n "$tag" ]]; then
            if [[ "$(git rev-parse "refs/tags/$tag^{commit}")" != "$commit" ]]; then
              echo "::error::The checkout is not on $tag's commit."
              exit 1
            fi
            version="${tag#v}"
            publish=true
          else
            version="$(packaging/next-version.sh)"
            tag="v$version"
            if [[ "$EVENT" == push || "$EVENT" == workflow_dispatch ]]; then
              if [[ "$REF" != refs/heads/main ]]; then
                echo "::error::Only main is released. To publish a tag again, dispatch this workflow with it."
                exit 1
              fi
              released="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | paste -sd ' ' - || true)"
              if [[ -n "$released" ]]; then
                echo "::notice::$commit has a release already, $released, so this run publishes nothing."
              else
                publish=true
              fi
            fi
          fi
          # The apps' numbers, which fail here for a version they cannot number, before anything
          # is built.
          packaging/apps/version.sh "$tag" >/dev/null
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "commit=$commit"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::$tag, on $commit. Published: $publish."

      # What a pull request changes of how a release is packaged, as opposed to what it builds.
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'pull_request'
        id: paths
        with:
          filters: |
            packaging:
              - '.github/workflows/release.yml'
              - 'packaging/**'

      # The targets built, as the build job's matrix.
      #
      # Linux is linked against glibc 2.28's symbols rather than the runner's, so it starts on
      # Debian 10, Ubuntu 20.04, RHEL 8 and everything since. Linked against the runner's own, it
      # needed 2.39, which Debian 12 and Ubuntu 22.04 do not have. The Intel Mac's build is
      # cross-compiled on Apple silicon: Apple's toolchain builds for both architectures, and the
      # Intel runner took 28 minutes for 1.0 where Apple silicon took 12.
      - name: The targets
        id: targets
        env:
          LINUX_ONLY: ${{ github.event_name == 'pull_request' && steps.paths.outputs.packaging != 'true' }}
        run: |
          all='[
            {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu", "glibc": "2.28"},
            {"os": "macos-latest", "target": "aarch64-apple-darwin"},
            {"os": "macos-latest", "target": "x86_64-apple-darwin"},
            {"os": "windows-latest", "target": "x86_64-pc-windows-msvc"}
          ]'
          if [[ "$LINUX_ONLY" == true ]]; then
            targets="$(jq -c '[.[] | select(.os == "ubuntu-latest")]' <<<"$all")"
            echo "::notice::Only the dependencies or the toolchain changed, so only Linux is built."
          else
            targets="$(jq -c . <<<"$all")"
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Packages are made for a release only. On the schedule and on a pull request the build is
      # for the cache or the checks.
      PACKAGE: ${{ needs.version.outputs.publish }}
    strategy:
      fail-fast: false
      matrix:
        # The version job's list, with why each target is built as it is.
        include: ${{ fromJSON(needs.version.outputs.targets) }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.commit }}

      # The toolchain rust-toolchain.toml pins, with the target added to it: the Intel macOS
      # build is cross-compiled, so its target is not the runner's own. tools/ci-toolchain.sh
      # also removes the toolchains the runner image came with, as in ci.yml: the Rust cache's
      # key hashes every toolchain installed, and the image's own stable moves with each image
      # update. A tag from before the script installs as it did then.
      - shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [[ -f tools/ci-toolchain.sh ]]; then
            tools/ci-toolchain.sh "$TARGET"
          else
            rustup toolchain install && rustup target add "$TARGET"
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          # Linux's dependencies are compiled by zig against its glibc, so they are keyed by that
          # glibc and never mixed with ones compiled another way.
          key: ${{ matrix.glibc && format('{0}.{1}', matrix.target, matrix.glibc) || matrix.target }}
          # Saved only where a later release can restore it (see `on`). A dispatched run starts
          # from main too, so it saves.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # A failed build still leaves its compiled dependencies worth keeping.
          cache-on-failure: true

      # After the cache step, which keys the cache by the manifests as they are committed, so a
      # new version does not make a new cache. Only the workspace's own crates change with it,
      # and the cache keeps none of those.
      - name: The version
        shell: bash
        run: bash packaging/set-version.sh "$VERSION"

      # aws-lc-sys assembles its own crypto primitives and needs NASM on Windows.
      - name: Install NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      # zig carries the headers and symbols of every glibc, so it links against the floor's on
      # any runner. cargo-zigbuild points cargo, cc and cmake at it.
      - name: Install zig
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          # It would save a cache from every run, pull requests and tags included, where no later
          # run can read it (see `on`).
          use-cache: false

      - name: Install cargo-zigbuild
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.4

      - name: Build
        if: runner.os != 'Linux'
        run: cargo build --release --locked --target ${{ matrix.target }} -p anistream

      # The suffix on the target is the glibc to link against. The binary still lands in
      # target/<target>/release.
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: >-
          cargo zigbuild --release --locked
          --target ${{ matrix.target }}.${{ matrix.glibc }} -p anistream

      # A symbol from a later glibc already fails the link above. This reads the finished binary,
      # so it holds however the binary comes to be built.
      - name: Check the glibc floor
        if: runner.os == 'Linux'
        run: packaging/linux/glibc-floor.sh target/${{ matrix.target }}/release/anistream ${{ matrix.glibc }}

      # The check above reads what the binary asks for. Running it on the oldest systems it claims
      # is what shows it starts there. No network and no terminal: --doctor reports what it cannot
      # reach rather than waiting for it. The Debian and Ubuntu images have no CA certificates,
      # and anistream will not build its HTTP client without any, so they borrow the runner's.
      - name: Run on older distros
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for image in debian:10 almalinux:8 ubuntu:20.04 debian:11 ubuntu:22.04; do
            echo "::group::$image"
            docker run --rm --network none \
              -v "$PWD/target/${{ matrix.target }}/release/anistream:/usr/local/bin/anistream:ro" \
              -v /etc/ssl/certs/ca-certificates.crt:/run/ca-certificates.crt:ro \
              -e SSL_CERT_FILE=/run/ca-certificates.crt \
              "$image" sh -ec '
                ldd --version | head -n 1
                anistream --version
                anistream --help > /dev/null
                timeout 60 anistream --doctor
              '
            echo "::endgroup::"
          done

      # The licences of every Rust crate in this target's binary, which each package carries in
      # its third-party folder (packaging/third-party.sh). On every run, so a pull request finds a
      # crate under a licence packaging/rust-licences/about.toml does not accept before a release
      # does.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - name: The Rust crates' licences
        shell: bash
        run: bash packaging/rust-licences/generate.sh terminal target/THIRD-PARTY-rust.txt ${{ matrix.target }}

      # Archive format follows what each platform's users expect to double-click.
      - name: Package (unix)
        if: env.PACKAGE == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          version="$VERSION"
          name="anistream-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/anistream" "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          packaging/third-party.sh "dist/${name}/third-party"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          shasum -a 256 "dist/${name}.tar.gz" > "dist/${name}.tar.gz.sha256"

      - name: Package (windows)
        if: env.PACKAGE == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${env:VERSION}"
          $name = "anistream-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/anistream.exe" "dist/$name/"
          Copy-Item README.md,LICENSE "dist/$name/"
          # The notices for what the binary embeds; packaging/third-party.sh for the others.
          New-Item -ItemType Directory -Force -Path "dist/$name/third-party" | Out-Null
          Copy-Item assets/THIRD-PARTY.md "dist/$name/third-party/"
          Copy-Item assets/shaders/THIRD-PARTY.md "dist/$name/third-party/THIRD-PARTY-shaders.md"
          Copy-Item assets/mpv/licenses/*,assets/shaders/LICENSE-* "dist/$name/third-party/"
          Copy-Item target/THIRD-PARTY-rust.txt "dist/$name/third-party/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower() +
            "  $name.zip" | Out-File "dist/$name.zip.sha256" -Encoding ascii

      # ── Installers ──────────────────────────────────────────────────────────
      # The archives above are for people who want the binary on PATH. These are for people who
      # want something to install and launch. Both end up in the same release.

      - name: Installer (Windows)
        if: env.PACKAGE == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          $version = "${env:VERSION}"
          $stage = "installer-src"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/anistream.exe" $stage
          Copy-Item assets/icon/anistream.ico,LICENSE,README.md $stage
          Copy-Item "dist/*/third-party" $stage -Recurse
          # Braces are load-bearing: without them pwsh parses `$env:ProgramFiles` and
          # appends `(x86)` as literal text, pointing at a directory that does not exist.
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" `
            "/DVERSION=$version" "/DSOURCE=$((Resolve-Path $stage).Path)" `
            packaging/windows/anistream.nsi
          # makensis resolves a relative OutFile against the .nsi's directory, not the cwd.
          Move-Item "packaging/windows/anistream-$version-setup.exe" dist/
          (Get-FileHash "dist/anistream-$version-setup.exe" -Algorithm SHA256).Hash.ToLower() +
            "  anistream-$version-setup.exe" |
            Out-File "dist/anistream-$version-setup.exe.sha256" -Encoding ascii

      - name: Installer (macOS)
        if: env.PACKAGE == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          version="$VERSION"
          arch="${{ matrix.target }}"
          app="stage/root/Applications/anistream.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" stage/scripts

          sed "s|<string>0\.0\.0</string>|<string>${version}</string>|g" \
            packaging/macos/Info.plist > "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"

          install -m 755 packaging/macos/launcher.sh "$app/Contents/MacOS/launcher"
          install -m 755 "target/${arch}/release/anistream" "$app/Contents/MacOS/anistream"
          iconutil -c icns assets/icon/anistream.iconset \
            -o "$app/Contents/Resources/anistream.icns"
          packaging/third-party.sh "$app/Contents/Resources/third-party"

          # Installing the .app also puts the binary on PATH, so the two ways of running it stay
          # the same build rather than drifting apart.
          cat > stage/scripts/postinstall <<'EOF'
          #!/bin/sh
          mkdir -p /usr/local/bin
          ln -sf /Applications/anistream.app/Contents/MacOS/anistream /usr/local/bin/anistream
          exit 0
          EOF
          chmod +x stage/scripts/postinstall

          pkg="dist/anistream-${version}-${arch}.pkg"
          pkgbuild --root stage/root --scripts stage/scripts \
            --identifier tv.anistream.anistream --version "${version}" \
            --install-location / "${pkg}"
          shasum -a 256 "${pkg}" > "${pkg}.sha256"

      - name: Installer (Linux)
        if: env.PACKAGE == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          version="$VERSION"
          root="stage/deb"
          mkdir -p "$root/DEBIAN" "$root/usr/bin" \
            "$root/usr/share/applications" "$root/usr/share/doc/anistream"

          install -m 755 "target/${{ matrix.target }}/release/anistream" "$root/usr/bin/anistream"
          install -m 644 packaging/linux/anistream.desktop \
            "$root/usr/share/applications/anistream.desktop"
          install -m 644 LICENSE "$root/usr/share/doc/anistream/copyright"
          packaging/third-party.sh "$root/usr/share/doc/anistream/third-party"
          for size in 16 32 48 64 128 256 512; do
            dir="$root/usr/share/icons/hicolor/${size}x${size}/apps"
            mkdir -p "$dir"
            install -m 644 "assets/icon/${size}x${size}.png" "$dir/anistream.png"
          done

          # mpv and ffmpeg are runtime dependencies anistream shells out to, so declare them
          # rather than vendor them — bundling mpv would pull GPL obligations onto an MIT binary.
          # libc6 is the floor the binary was linked against, so apt refuses an older system
          # rather than installing something that cannot start.
          cat > "$root/DEBIAN/control" <<EOF
          Package: anistream
          Version: ${version}
          Section: video
          Priority: optional
          Architecture: amd64
          Depends: libc6 (>= ${{ matrix.glibc }}), mpv, ffmpeg
          Maintainer: anistream <noreply@anistream.tv>
          Homepage: https://anistream.tv
          Description: An anime streaming TUI
           Browse, track and watch anime from the terminal. Real image rendering,
           mpv for playback, pluggable sources.
           .
           anistream hosts no content.
          EOF

          deb="dist/anistream-${version}-amd64.deb"
          dpkg-deb --build --root-owner-group "$root" "$deb"
          sha256sum "$deb" > "$deb.sha256"

      # For everyone not on a Debian lineage: one self-contained file, no package manager
      # involved. mpv and ffmpeg stay host-installed for the same licensing reason as the .deb.
      - name: AppImage (Linux)
        if: env.PACKAGE == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          version="$VERSION"
          appdir="stage/AppDir"
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/applications" \
            "$appdir/usr/share/icons/hicolor/256x256/apps"

          install -m 755 "target/${{ matrix.target }}/release/anistream" "$appdir/usr/bin/anistream"
          # appimagetool insists on the desktop file and icon at the AppDir root; the copies
          # under usr/share are what menu integration reads if the user installs it.
          install -m 644 packaging/linux/anistream.desktop "$appdir/anistream.desktop"
          install -m 644 packaging/linux/anistream.desktop \
            "$appdir/usr/share/applications/anistream.desktop"
          install -m 644 assets/icon/256x256.png "$appdir/anistream.png"
          install -m 644 assets/icon/256x256.png \
            "$appdir/usr/share/icons/hicolor/256x256/apps/anistream.png"
          cp "$appdir/anistream.png" "$appdir/.DirIcon"
          packaging/third-party.sh "$appdir/usr/share/doc/anistream/third-party"
          ln -s usr/bin/anistream "$appdir/AppRun"

          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          appimage="dist/anistream-${version}-x86_64.AppImage"
          # --appimage-extract-and-run: hosted runners have no FUSE, and the tool is itself
          # an AppImage; extracting first is how it runs at all here.
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$appdir" "$appimage"
          sha256sum "$appimage" > "$appimage.sha256"

      # One file for the release beside the packages: every Rust crate in any of the four
      # binaries, with its licence. The targets are the matrix's.
      - name: The Rust crates' licences, for the release
        if: env.PACKAGE == 'true' && runner.os == 'Linux'
        shell: bash
        run: >-
          packaging/rust-licences/generate.sh terminal "dist/anistream-${VERSION}-rust-licences.txt"
          x86_64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc

      - uses: actions/upload-artifact@v7
        if: env.PACKAGE == 'true'
        with:
          name: terminal-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.pkg
            dist/*.deb
            dist/*.AppImage
            dist/*setup.exe
            dist/*.sha256
            dist/*-rust-licences.txt

  # The apps, built beside the terminal binaries for a release only: main and the schedule build
  # here for the cache, which the apps do not share. A pull request that changes how they are
  # built runs apps-release.yml itself, as a dry run.
  apps:
    needs: version
    if: needs.version.outputs.publish == 'true'
    uses: ./.github/workflows/apps-release.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
      ref: ${{ needs.version.outputs.commit }}
    secrets:
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      MAC_UPDATE_ED25519_KEY: ${{ secrets.MAC_UPDATE_ED25519_KEY }}

  # Once every build has succeeded: the terminal's files and the apps', with the notes, as a
  # draft, which publishing turns into the release and its tag, marked latest
  # (packaging/publish.sh). Nothing is public before that, and a failure leaves no tag.
  publish:
    name: Publish
    needs: [version, build, apps]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Writing the release and its tag, and reading the pull request merged as the commit.
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.commit }}
          sparse-checkout: packaging
      - uses: actions/download-artifact@v8
        with:
          pattern: terminal-*
          path: dist/terminal
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: apps-*
          path: dist/apps
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          COMMIT: ${{ needs.version.outputs.commit }}
        run: packaging/publish.sh "$TAG" "$COMMIT" dist/terminal dist/apps

  # The plugin store's image for the release, ghcr.io/bitknox/anistream-store, once the release
  # is out. Called here rather than started by the tag, since a tag made with this run's token
  # starts no workflow.
  store-image:
    name: Store image
    needs: [version, publish]
    if: needs.version.outputs.publish == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/store-image.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
