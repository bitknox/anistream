name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request makes the running checks moot. Pushes to main are left
# to finish, because their caches are the ones every pull request restores from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing here writes to the repository; the token should not be able to either.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Line tables keep a failing test's backtrace readable. Full debug info only adds link time
  # and cache size, and on Windows uploading the cache had become the slowest step after the
  # build itself.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # Which parts a pull request touches, so a change to the apps alone does not wait on the whole
  # Rust matrix, and a change to the engine still runs everything the apps build on. Pushes to
  # main run every job regardless: their caches are the ones pull requests restore from.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name == 'push' || steps.filter.outputs.rust == 'true' }}
      apple: ${{ github.event_name == 'push' || steps.filter.outputs.rust == 'true' || steps.filter.outputs.apple == 'true' }}
      android: ${{ github.event_name == 'push' || steps.filter.outputs.rust == 'true' || steps.filter.outputs.android == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'wit/**'
              - 'assets/**'
              - 'deploy/**'
              - 'packaging/**'
              - 'tools/**'
              - '.cargo/**'
              - '.config/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - 'deny.toml'
              - '.github/workflows/ci.yml'
            apple:
              - 'apple/**'
            android:
              - 'android/**'

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      # Installs exactly what rust-toolchain.toml pins. Installing `stable` first only
      # downloaded a second toolchain that the pinned one then replaced.
      - run: rustup toolchain install

      # Only main saves. Pull requests restore main's cache, and letting each of them upload
      # its own pushed main's out of the repository's cache quota.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # aws-lc-sys assembles its own primitives and needs NASM on Windows. It is not on the
      # runner image, and without it the build fails inside a C dependency rather than anywhere
      # informative.
      - name: Install NASM
        if: matrix.os == 'windows-latest'
        uses: ilammy/setup-nasm@v1

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # nextest builds every test target and runs the binaries in parallel, where `cargo test`
      # runs them one after another; a separate build step only compiled the same code twice.
      - name: Test
        run: cargo nextest run --workspace --profile ci

      # The engine as a phone builds it, without the desktop feature, run here where it can be:
      # what a play and a sign-in through a redirect answer when there is no mpv and no
      # loopback listener. The workspace above builds it with the feature, as the app does.
      - name: Test the engine without the desktop feature
        run: cargo nextest run -p anistream-engine --no-default-features --lib --profile ci

  # The real-mpv tests (the companion script, whole binges, the seek-bar thumbnailers) skip
  # where mpv is missing, which is every runner above. Here apt installs mpv and the tests
  # require it, so a skip fails instead. At both ends of what distributions ship: Ubuntu 24.04's
  # 0.37 is the oldest that runs the companion (0.36 is its floor) and lacks what later players
  # added, such as a scaled overlay (0.38) and the context menu (0.40); 26.04's 0.41 has them.
  mpv:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: mpv (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Install mpv
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mpv
      - run: mpv --version | head -1
      - name: Test
        run: >-
          cargo nextest run --profile ci -p anistream -p anistream-engine -p anistream-player
          -p anistream-providers -E 'group(mpv)'
        env:
          ANISTREAM_REQUIRE_MPV: "1"

  # Its own job rather than a step after the tests, so it runs beside them instead of adding
  # to them: clippy checks dependencies in a different mode and cannot reuse the test build.
  # Still on every OS, because the Windows named-pipe and macOS paths only exist there.
  clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install NASM
        if: matrix.os == 'windows-latest'
        uses: ilammy/setup-nasm@v1
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The engine without its desktop parts, as the phone builds below compile it: a `cfg` the
      # desktop build never sees can still leave something unused there.
      - run: cargo clippy -p anistream-engine --no-default-features --all-targets -- -D warnings

  # The engine has to run under front ends that are not a terminal, so the layers beneath the
  # terminal front end may never depend on a terminal library. Resolving the tree needs no
  # build, so this is quick.
  boundaries:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: tools/check-boundaries.sh

  # The model's types as UniFFI hands them to a native front end, with the core's that they carry.
  # Fails on a type that cannot cross a foreign-function boundary: a tuple, a borrowed string, a
  # tuple struct, a Result in a field, or a core type without a conversion. Linted as the rest of
  # the workspace is, since the derives are code too.
  ffi:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy -p anistream-model --features ffi --all-targets -- -D warnings

  # Swift drives a real engine through the generated bindings: apple/build.sh builds the FFI
  # library with the test kit in it, generates each crate's Swift bindings from the built library,
  # and runs the Swift package's tests, which start the engine on a fake AniList and send it the
  # model's own commands.
  swift:
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: macos-latest
    env:
      # The Swift package's minimum, as apple/build.sh sets it, so the Rust tests share its build.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      # Its own cache: this build has features and a deployment target no other job's has.
      - uses: Swatinem/rust-cache@v2
        with:
          key: swift
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: swift --version
      - name: Rust tests
        run: cargo test -p anistream-ffi --features testing,cli
      # The apps build the engine without the desktop feature, so its hosted player has to pass
      # its contract in that build too.
      - name: Rust tests, the apps' build
        run: cargo test -p anistream-ffi --no-default-features --features testing
      - name: Swift tests
        run: apple/build.sh

  # The engine and its FFI library as an iPhone builds them: without the desktop feature, so
  # without mpv, Syncplay, the loopback sign-in and the keychain crate, and with plugins run by
  # wasmtime's interpreter. Cross-compiled only, since nothing here runs iOS. The part that can
  # break is the C beneath it, built with the runner's Xcode for the iOS SDK: BoringSSL (cmake
  # and bindgen), aws-lc, SQLite, zstd and wasmtime's own helpers.
  ios:
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: macos-latest
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install && rustup target add aarch64-apple-ios
      # Its own cache: nothing else here builds for this target.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: The engine
        run: cargo build -p anistream-engine --no-default-features --target aarch64-apple-ios
      # The static library an app links, and the dynamic one, both linked against the SDK.
      - name: The FFI library
        run: cargo build -p anistream-ffi --no-default-features --target aarch64-apple-ios

  # The same for an Android phone, with the runner's newest NDK through cargo-ndk, which points
  # every C build at the NDK's clang for API level 35, the Android app's minimum. Cross-compiled
  # only, and the library checked for what Android needs of it. Then the Android app on top: its
  # engine and Kotlin bindings as android/scripts/engine.sh builds them, the fixtures APK, and the
  # JVM unit tests, which start the testing engine on this runner's own build of the library
  # through JNA. Emulator tests come later.
  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install && rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      # The newest NDK the runner has, which links 16 KB aligned (r28 and later), where
      # ANDROID_NDK_HOME may name an older one. And bindgen's clang arguments, for BoringSSL's
      # bindings: bindgen asks clang for the Rust target as it is named, without an API level,
      # and the NDK's headers refuse an unversioned one. cargo-ndk 4 sets the underscored
      # BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android itself, to the sysroot alone, over any
      # value given it, so the level goes in the hyphenated name, which bindgen reads first, with
      # the sysroot beside it.
      - name: The NDK and bindgen's arguments for it
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          sysroot="$ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          {
            echo "ANDROID_NDK_HOME=$ndk"
            echo "BINDGEN_ANDROID=--target=aarch64-linux-android35 --sysroot=$sysroot -I$sysroot/usr/include/aarch64-linux-android"
          } >> "$GITHUB_ENV"
      - name: The engine
        run: >-
          env "BINDGEN_EXTRA_CLANG_ARGS_aarch64-linux-android=$BINDGEN_ANDROID"
          cargo ndk --target arm64-v8a --platform 35
          build -p anistream-engine --no-default-features
      - name: The FFI library
        run: >-
          env "BINDGEN_EXTRA_CLANG_ARGS_aarch64-linux-android=$BINDGEN_ANDROID"
          cargo ndk --target arm64-v8a --platform 35
          build -p anistream-ffi --no-default-features
      # Android 15 devices can run 16 KB pages, and a library with 4 KB aligned segments does not
      # load on them. And a library that needed libc++_shared.so would have the app ship it.
      - name: The library loads on 16 KB pages and needs only the system's libraries
        run: |
          bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          so=target/aarch64-linux-android/debug/libanistream_ffi.so
          "$bin/llvm-readelf" -d "$so" | grep NEEDED
          if "$bin/llvm-readelf" -d "$so" | grep -q 'libc++_shared'; then
            echo "the library needs libc++_shared.so, which the app would have to ship"; exit 1
          fi
          if "$bin/llvm-objdump" -p "$so" | grep LOAD | grep -vq 'align 2\*\*14'; then
            echo "a LOAD segment is not 16 KB aligned"; exit 1
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # Gradle's caches and the wrapper's distribution, saved from main like the Rust cache.
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # The platform the app compiles against, and the NDK its build.gradle.kts strips the APK's
      # libraries with; the engine itself builds with the newest NDK, above.
      - name: The SDK platform and NDK the app builds with
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" "ndk;30.0.16248370" >/dev/null
      # The fixtures flavour's engine and its bindings, which engine.sh builds with the same
      # bindgen arguments, and the fonts.
      - name: The app's engine and bindings
        run: android/scripts/engine.sh testing
        env:
          # The workspace's own, which the Rust cache keeps, rather than the script's default in HOME.
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
      - name: The app's fonts
        run: android/scripts/fonts.sh
      - name: The fixtures APK and the unit tests
        working-directory: android
        run: ./gradlew --console=plain assembleFixturesDebug testFixturesDebugUnitTest

  # The plugin store's admin page is committed as built output, so building the server never
  # needs bun. This rebuilds it from source and fails if the two have drifted apart.
  admin-page:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/anistream-store-core/admin
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: The committed build matches its source
        run: git diff --exit-code -- ../assets/admin

  # The serverless deploy templates carry the store as committed WebAssembly, so deploying one
  # from its button never needs Rust. The package cannot be compared byte for byte with a build
  # here: cargo mixes the host into every crate's identity, and wasm-bindgen's exported names
  # carry it. So sync.sh records the sources it built from, this fails with a diff when they have
  # moved on or a template's copy differs, and the build below proves it still compiles.
  # store-templates runs the committed copies through the whole store journey.
  store-wasm:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install && rustup target add wasm32-unknown-unknown
      - name: The committed package matches its sources
        run: deploy/sync.sh --check
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1
      - name: It still builds
        run: >-
          wasm-pack build crates/anistream-store-wasm --release --target web
          --out-dir "$RUNNER_TEMP/store-wasm" --out-name store --no-pack

  # Each serverless template, run on the runner the way its platform runs it, through the whole
  # journey a store's owner and members take: claim, publish in parts, join, download in ranges,
  # remove, sign in to the admin page. Nothing else exercises the templates' JavaScript.
  store-templates:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: oven-sh/setup-bun@v2
      # Vercel's functions run on Node 24, and the Netlify and test hosts run on whatever node is
      # first on the path.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install each template's dependencies
        run: for dir in cloudflare vercel netlify test; do (cd "deploy/$dir" && bun install --frozen-lockfile); done
      - run: deploy/test/journeys.sh

  audit:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # A prebuilt binary: compiling cargo-audit from source took two minutes per run.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Advisory policy lives in .cargo/audit.toml, where each ignore carries its
      # justification — a silent pass would defeat the point of running this. Invoked
      # directly rather than through `cargo`, which would install the pinned toolchain only
      # to read Cargo.lock.
      - run: cargo-audit audit
