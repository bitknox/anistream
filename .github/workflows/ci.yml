name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request makes the running checks moot. Pushes to main are left
# to finish, because their caches are the ones every pull request restores from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing here writes to the repository; the token should not be able to either.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Line tables keep a failing test's backtrace readable. Full debug info only adds link time
  # and cache size, and on Windows uploading the cache had become the slowest step after the
  # build itself.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # As rust-cache sets it, for the jobs without one too: incremental compilation only adds to a
  # build that runs once.
  CARGO_INCREMENTAL: "0"

jobs:
  # Which parts a pull request touches, so a change to the apps alone does not wait on the whole
  # Rust matrix, and a change to the engine still runs everything the apps build on.
  #
  # A push to main tests nothing: the pull request tested the merge already. It builds what the
  # jobs with caches build, so their caches, which pull requests restore from, are main's, and
  # the checks without a cache do not run at all. Of the macOS and Windows jobs, a push runs only
  # those whose cache its change would make a new one: macOS runners are five at a time for the
  # whole account, and a cache is keyed by what its job's build starts from, so a push that
  # changes none of that has the cache already.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      rust: ${{ github.event_name == 'push' || steps.filter.outputs.rust == 'true' }}
      native: ${{ steps.diff.outputs.native }}
      engine: ${{ steps.diff.outputs.engine }}
      apple: ${{ steps.diff.outputs.apple }}
      android: ${{ github.event_name == 'push' || steps.filter.outputs.rust == 'true' || steps.filter.outputs.android == 'true' }}
      windows: ${{ steps.filter.outputs.windows == 'true' || steps.diff.outputs.engine == 'true' }}
      desktop-linux: ${{ github.event_name == 'push' || steps.filter.outputs.rust == 'true' || steps.filter.outputs.desktop-linux == 'true' }}
    steps:
      # Two commits: on a pull request the merge, whose first parent is the base, and on a push
      # main's new head, beside which the previous head is fetched below.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'wit/**'
              - 'assets/**'
              - 'deploy/**'
              - 'packaging/**'
              - 'tools/**'
              - '.cargo/**'
              - '.config/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - 'deny.toml'
              - '.github/workflows/ci.yml'
            android:
              - 'android/**'
            windows:
              - 'desktop/windows/**'
              - '.github/workflows/ci.yml'
            desktop-linux:
              - 'desktop/linux/**'
              - '.github/workflows/ci.yml'

      # The files this change touches, and from them the three things the macOS and Windows jobs
      # are decided by:
      #
      #   native  the workspace's tests on the Mac and on Windows. Rust that is built for them:
      #           not deploy/, the packaging, the other tools, the store admin page's sources
      #           (the Rust embeds its committed build, which is in assets/) or the WebAssembly
      #           crate, which Linux's job tests as it does them all.
      #   engine  something the apps' engine is built from (tools/engine-sources.sh, the crates
      #           anistream-ffi depends on, read from the manifests, so a crate joining the tree
      #           is in the filter from the commit that adds it), or the FFI's own tests.
      #   apple   the Apple jobs: the engine, the Swift, the shaders the player's tests read, and
      #           what builds them here.
      #
      # On a push the same questions are asked of what a cache is made from, so only a push that
      # moves one builds it: the Rust cache's key (the manifests, the lock file, the toolchain
      # and .cargo) for native, and the engines' and libmpv's keys (the engine sources, mpv.sh
      # and its patches, engine.sh) for apple.
      - name: What changed
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=HEAD^1
          [[ "$EVENT" == push ]] && base="$BEFORE"
          if git cat-file -e "$base^{commit}" 2>/dev/null || git fetch -q --no-tags --depth=1 origin "$base" 2>/dev/null; then
            git diff --name-only "$base" HEAD > "$RUNNER_TEMP/changed.txt"
          else
            echo "::warning::$base is not to be had, so everything counts as changed."
            echo . > "$RUNNER_TEMP/changed.txt"
          fi
          echo "::group::Changed files"; head -n 200 "$RUNNER_TEMP/changed.txt"; echo "::endgroup::"
          everything=false
          [[ "$(cat "$RUNNER_TEMP/changed.txt")" == . ]] && everything=true

          ci=(.github/workflows/ci.yml tools/ci-toolchain.sh tools/engine-sources.sh tools/engine-touched.sh)
          # Rust as the Mac and Windows build it.
          native_re='^(crates/|wit/|assets/|\.cargo/|\.config/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.github/workflows/ci\.yml$|tools/ci-toolchain\.sh$)'
          # What the Rust cache's key is made from.
          cache_re='(^|/)Cargo\.(toml|lock)$|^(rust-toolchain\.toml|\.cargo/|\.github/workflows/ci\.yml$|tools/ci-toolchain\.sh$)'
          # The manifests are read with the runner's own cargo: rust-toolchain.toml would have
          # rustup download the pinned toolchain for a job that compiles nothing.
          export RUSTUP_TOOLCHAIN=stable
          tools/engine-touched.sh --test

          if [[ "$EVENT" == pull_request ]]; then
            native=$(grep -Ev '^(crates/anistream-store-core/admin/|crates/anistream-store-wasm/)' "$RUNNER_TEMP/changed.txt" | grep -Ec "$native_re" || true)
            engine=$(tools/engine-touched.sh crates/anistream-ffi/ < "$RUNNER_TEMP/changed.txt")
            apple=$(tools/engine-touched.sh crates/anistream-ffi/ apple/ assets/ "${ci[@]}" < "$RUNNER_TEMP/changed.txt")
          else
            native=$(grep -Ec "$cache_re" "$RUNNER_TEMP/changed.txt" || true)
            apple=$(tools/engine-touched.sh apple/scripts/engine.sh apple/scripts/mpv.sh apple/patches/ "${ci[@]}" < "$RUNNER_TEMP/changed.txt")
          fi
          [[ "$native" != 0 ]] && native=true || native=false
          if [[ "$everything" == true ]]; then native=true; engine=true; apple=true; fi
          # A push runs the Apple job to build its caches, and the job finds by the caches
          # themselves which it lacks; it tests nothing.
          [[ "$EVENT" == push ]] && engine=$apple
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
          echo "apple=$apple" >> "$GITHUB_OUTPUT"
          echo "::notice::Mac and Windows tests: $native. Apple jobs: $apple. Engine changed: $engine."

      # The repository's caches share 10 GB. Over it, every save in every workflow fails with
      # "Unable to reserve cache", the jobs that restore from main find nothing, and a pull
      # request builds all it has. A warning here is the first sign, where the failed saves are
      # lines in the logs of other jobs.
      - name: The caches' room
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          used="$(gh api "repos/$GITHUB_REPOSITORY/actions/cache/usage" --jq '.active_caches_size_in_bytes' || echo 0)"
          echo "The caches hold $((used / 1000000)) MB of 10000."
          if (( used > 9000000000 )); then
            echo "::warning::The caches hold $((used / 1000000)) MB of 10,000: saves fail above it. Delete the caches no workflow reads any more (gh cache list --sort last_accessed_at --order asc)."
          fi

  # The workspace's tests and lint on the Mac and on Windows; Linux's are the linux job's, below.
  # Each builds once and runs every test from that build: compiling is nearly all of the time
  # (the 2,300 tests run in half a minute), so splitting the run across runners would only
  # compile the same code again on each. Clippy follows in the same job rather than one of its
  # own: it checks dependencies in a different mode and cannot reuse the test build, but a job
  # of its own waited for a runner of its own, and macOS runners are five at a time.
  test:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      # Installs exactly what rust-toolchain.toml pins. Installing `stable` first only
      # downloaded a second toolchain that the pinned one then replaced. And removes the image's
      # own, since the Rust cache's key hashes every toolchain installed: each image update gave
      # main's caches new keys, which no pull request could restore. Every job with a Rust cache
      # starts so.
      - run: tools/ci-toolchain.sh
        shell: bash

      # Only main saves. Pull requests restore main's cache, and letting each of them upload
      # its own pushed main's out of the repository's cache quota.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # aws-lc-sys assembles its own primitives and needs NASM on Windows. It is not on the
      # runner image, and without it the build fails inside a C dependency rather than anywhere
      # informative.
      - name: Install NASM
        if: matrix.os == 'windows-latest'
        uses: ilammy/setup-nasm@v1

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # nextest builds every test target and runs the binaries in parallel, where `cargo test`
      # runs them one after another; a separate build step only compiled the same code twice.
      # On main, `cargo test --no-run` builds what nextest builds, for the cache, and runs none.
      - name: Test
        run: >-
          ${{ github.event_name == 'push' && 'cargo test --workspace --no-run'
          || 'cargo nextest run --workspace --profile ci' }}

      # The engine as the apps build it, without the desktop feature, run here where it can be:
      # what a play and a sign-in through a redirect answer when there is no mpv and no
      # loopback listener. The workspace above builds it with the feature, as the terminal does.
      # On the Mac, whose app is built so, and on Linux, nearest the Android one; not on Windows,
      # where nothing is built without the desktop feature, and which would compile the engine
      # again for it.
      - name: Test the engine without the desktop feature
        if: matrix.os == 'macos-latest'
        run: >-
          ${{ github.event_name == 'push' && 'cargo test -p anistream-engine --no-default-features --lib --no-run'
          || 'cargo nextest run -p anistream-engine --no-default-features --lib --profile ci' }}

      # The FFI's own tests with the test kit, which the workspace above leaves off, on the Mac
      # the Swift packages' engine is built on. Here rather than in the apple job, so the
      # xcode-27 runners, which every macOS job queues for, spend no time on a build that is
      # not the apps'.
      - name: The FFI's tests with the test kit
        if: matrix.os == 'macos-latest'
        run: cargo test -p anistream-ffi --features testing,cli${{ github.event_name == 'push' && ' --no-run' || '' }}

      # After the tests, and even when they failed, so one run reports both. Still on every OS,
      # because the Windows named-pipe and macOS paths only exist there. Not on main.
      - name: Clippy
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The engine without its desktop parts, as the apps' builds compile it: a `cfg` the desktop
      # build never sees can still leave something unused there. Not on Windows, where nothing is
      # built so.
      - name: Clippy, the engine without the desktop feature
        if: ${{ !cancelled() && github.event_name == 'pull_request' && matrix.os == 'macos-latest' }}
        run: cargo clippy -p anistream-engine --no-default-features --all-targets -- -D warnings

  # The workspace's tests on Linux, built once and archived for the mpv jobs below, which run
  # theirs from the archive rather than compiling the workspace each. On 24.04, the older of the
  # images those jobs run on. With a Rust cache, since the mpv jobs wait on this build.
  linux:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: ubuntu-24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: tools/ci-toolchain.sh
      # Formatting is checked first: it needs no build, so a stray space fails in seconds.
      - name: Format
        run: cargo fmt --all --check
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Build the tests
        run: cargo nextest archive --workspace --archive-file "$RUNNER_TEMP/linux-tests.tar.zst"
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: linux-tests
          path: ${{ runner.temp }}/linux-tests.tar.zst
          if-no-files-found: error
          retention-days: 1
          # Already zstd.
          compression-level: 0
      # The build above, which cargo finds current. On main, only built, for the cache.
      - name: Test
        if: github.event_name == 'pull_request'
        run: cargo nextest run --workspace --profile ci
      - name: Test the engine without the desktop feature
        run: >-
          ${{ github.event_name == 'push' && 'cargo test -p anistream-engine --no-default-features --lib --no-run'
          || 'cargo nextest run -p anistream-engine --no-default-features --lib --profile ci' }}
      # Last, and after failed tests too. The mpv jobs start after it, still well inside what the
      # macOS jobs take.
      - name: Clippy
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy, the engine without the desktop feature
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: cargo clippy -p anistream-engine --no-default-features --all-targets -- -D warnings

  # The Linux desktop app, its own workspace over the engine: built, tested with the fixture
  # scene and without it, and linted. On 26.04, whose GTK 4.20 and libadwaita 1.8 are past the 4.16
  # and 1.7 the app asks for; 24.04 ships 4.14 and 1.5. The tests run under a virtual display,
  # since GTK wants one even to start. On main, only built, for the cache pull requests restore.
  desktop-linux:
    needs: changes
    if: needs.changes.outputs.desktop-linux == 'true'
    name: Linux app
    runs-on: ubuntu-26.04
    env:
      IMAGE: ubuntu-26.04
      PACKAGES: >-
        build-essential pkg-config cmake clang libclang-dev nasm perl
        libgtk-4-dev libadwaita-1-dev libmpv-dev libegl-dev
        xvfb xauth libgl1-mesa-dri libegl-mesa0 dbus-x11 adwaita-icon-theme
    defaults:
      run:
        working-directory: desktop/linux
    steps:
      - uses: actions/checkout@v7
      - run: ../../tools/ci-toolchain.sh
        working-directory: desktop/linux
      # The packages cached by exactly what apt would fetch, saved from main, as the mpv job does
      # (see "mpv's packages" below): the mirror once took most of an hour for these.
      - name: GTK, libadwaita and libmpv packages
        id: debs
        run: |
          sudo apt-get update
          list="$(sudo apt-get install -qq --no-install-recommends --print-uris $PACKAGES | awk '{print $2, $3, $4}')"
          echo "$list"
          echo "key=linux-app-debs-$IMAGE-$(sha256sum <<<"$list" | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore the packages
        id: debs-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-archives/*.deb
          key: ${{ steps.debs.outputs.key }}
      - name: Download the packages
        timeout-minutes: 20
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get install -y --no-install-recommends --download-only -o Dir::Cache::archives="$HOME/apt-archives" $PACKAGES
      - name: Install the packages
        run: sudo apt-get install -y --no-install-recommends -o Dir::Cache::archives="$HOME/apt-archives" $PACKAGES
      - name: Keep the packages
        if: github.ref == 'refs/heads/main' && steps.debs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/apt-archives/*.deb
          key: ${{ steps.debs-cache.outputs.cache-primary-key }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test with the fixture scene
        run: ${{ github.event_name == 'push' && 'cargo test --locked --features fixtures --no-run' || 'xvfb-run -a cargo test --locked --features fixtures' }}
      - name: Test without it
        run: ${{ github.event_name == 'push' && 'cargo test --locked --no-run' || 'xvfb-run -a cargo test --locked' }}
      - name: Clippy with the fixture scene
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: cargo clippy --locked --all-targets --features fixtures -- -D warnings
      - name: Clippy without it
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Formatting
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: cargo fmt --check

  # The real-mpv tests (the companion script, whole binges, the seek-bar thumbnailers) skip
  # where mpv is missing, which is every runner above. Here apt installs mpv and the tests
  # require it, so a skip fails instead. At both ends of what distributions ship: Ubuntu 24.04's
  # 0.37 is the oldest that runs the companion (0.36 is its floor) and lacks what later players
  # added, such as a scaled overlay (0.38) and the context menu (0.40); 26.04's 0.41 has them.
  #
  # They compile nothing: each runs its tests from the linux job's archive of the workspace's
  # tests, which is built on 24.04, the older image, since what links against its glibc runs on
  # 26.04's too. On main, only mpv's packages are fetched, for their cache.
  mpv:
    needs: [changes, linux]
    if: needs.changes.outputs.rust == 'true'
    name: mpv (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # mpv from the image's Ubuntu, its packages cached by the image and by exactly what apt
      # would fetch, saved from main: one run had the mirror send mpv's 68 MB at 98 kB/s for
      # eleven minutes. apt first fetches into the folder whatever the cache lacks and then
      # installs from the folder, so a run with the cache and one without take the same path.
      - name: mpv's packages
        id: debs
        env:
          IMAGE: ${{ matrix.os }}
        run: |
          sudo apt-get update
          list="$(sudo apt-get install -qq --no-install-recommends --print-uris mpv | awk '{print $2, $3, $4}')"
          echo "$list"
          echo "key=mpv-debs-$IMAGE-$(sha256sum <<<"$list" | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore mpv's packages
        id: debs-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-archives/*.deb
          key: ${{ steps.debs.outputs.key }}
      - name: Install mpv
        run: |
          mkdir -p ~/apt-archives/partial
          archives=(-o Dir::Cache::archives="$HOME/apt-archives")
          sudo apt-get install -y --no-install-recommends --download-only "${archives[@]}" mpv
          sudo apt-get install -y --no-install-recommends "${archives[@]}" mpv
      - name: Keep mpv's packages
        if: github.ref == 'refs/heads/main' && steps.debs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/apt-archives/*.deb
          key: ${{ steps.debs-cache.outputs.cache-primary-key }}
      - run: mpv --version | head -1
      - uses: actions/download-artifact@v8
        if: github.event_name == 'pull_request'
        with:
          name: linux-tests
          path: ${{ runner.temp }}
      - name: Test
        if: github.event_name == 'pull_request'
        run: >-
          cargo nextest run --archive-file "$RUNNER_TEMP/linux-tests.tar.zst"
          --workspace-remap "$GITHUB_WORKSPACE" --profile ci
          -E 'group(mpv) & (package(anistream) | package(anistream-engine) | package(anistream-player) | package(anistream-providers))'
        env:
          ANISTREAM_REQUIRE_MPV: "1"

  # The engine has to run under front ends that are not a terminal, so the layers beneath the
  # terminal front end may never depend on a terminal library. Resolving the tree needs no
  # build, so this is quick.
  boundaries:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: tools/check-boundaries.sh

  # The model's types as UniFFI hands them to a native front end, with the core's that they carry.
  # Fails on a type that cannot cross a foreign-function boundary: a tuple, a borrowed string, a
  # tuple struct, a Result in a field, or a core type without a conversion. Linted as the rest of
  # the workspace is, since the derives are code too.
  ffi:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # No Rust cache: it held 200 MB for a lint of one crate that takes half a minute without it.
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo clippy -p anistream-model --features ffi --all-targets -- -D warnings

  # Everything the Apple apps are held to, in one job on one Mac. macOS runners are five at a
  # time for the whole account, so two jobs that each set up a Mac, restored the same libmpv and
  # compiled the same dependencies queued twice as long and cost twice the minutes. Each group of
  # steps below is named for what it checks, so a failure reads as it did when they were two jobs:
  #
  #   Swift  the Swift packages' tests over a real engine (apple/scripts/test.sh builds the testing
  #          engine for macOS with apple/scripts/engine.sh, the static library as an XCFramework
  #          with each crate's Swift bindings generated from it, and runs every package's tests:
  #          the bindings, the design tokens, the app's store over a real engine on the fake
  #          AniList), then the Fixtures app's tests, which link it too, the Mac player's controls
  #          clicked, and the FFI's tests as the apps build it. The FFI's tests with the desktop
  #          feature are the macOS test job's.
  #   Apple  the app itself, from the XcodeGen project: built for an iPhone with signing off, and
  #          for the Mac in Release. The Xcode is named outright, since the runner's default moves.
  #
  # A group does not wait for the other to pass: its steps run after the other's failure, so one
  # run reports both.
  #
  # Built for an iPhone rather than the Simulator, so the C beneath the engine is built for the
  # SDK the app ships on: BoringSSL with cmake and bindgen, aws-lc, SQLite, zstd and wasmtime's
  # own helpers. And both on the engine in the app-dev profile: what a Release build alone can
  # break is the Swift, which the cargo profile beneath it does not change, and a second engine
  # in the release profile took ten minutes. The apps' release builds that one.
  #
  # The testing engine, the release engines and libmpv are saved from main, for the next pull
  # request, keyed by what their scripts build them from: a pull request that leaves the engine's
  # crates alone takes the engines from there and compiles no Rust at all. Both flavours are one
  # cache, as they are built here together, and the macOS slices of the two share every
  # dependency but the test kit. A push to main builds only what those caches lack, and no app,
  # and only when its change would make a new cache (the changes job).
  apple:
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    # Xcode 27.1, the build the app is developed with, so CI compiles what a local build does.
    runs-on: xcode-27
    env:
      XCODE: "27.1"
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # A push to main builds the engines for their caches, if the cache lacks them, and tests
      # nothing.
      CHECKS: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - run: tools/ci-toolchain.sh
      # What the engines are built from, as engine.sh hashes it: only the crates it compiles.
      - name: The engines' sources
        id: sources
        run: echo "hash=$(apple/scripts/engine.sh --sources-hash)" >> "$GITHUB_OUTPUT"
      # engine.sh's own cache of each slice it built (~/.cache/anistream-engine), by that hash.
      # Saved below, from main only, which only looks.
      - name: Restore the engines
        id: engine
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/anistream-engine/apple
          key: ci-apple-engines-xcode${{ env.XCODE }}-${{ steps.sources.outputs.hash }}
          lookup-only: ${{ github.event_name == 'push' }}
      # Not read when every engine came from the cache above and the Rust tests below are
      # skipped, since nothing here compiles but engine.sh.
      - uses: Swatinem/rust-cache@v2
        if: steps.engine.outputs.cache-hit != 'true' || (env.CHECKS == 'true' && needs.changes.outputs.engine == 'true')
        with:
          shared-key: apple
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: env.CHECKS == 'true'
        run: xcodebuild -version
      - if: env.CHECKS == 'true'
        run: brew install xcodegen
      # libmpv, which both apps embed and their player frameworks check for, kept by what
      # mpv.sh's stamp is made from. Before the Swift tests, which find it current.
      - name: libmpv's pin
        run: echo "MPV_PIN=$(sed -n 's/^mpvkit=//p' apple/scripts/mpv.sh)" >> "$GITHUB_ENV"
      - name: Restore libmpv
        id: mpv
        uses: actions/cache/restore@v6
        with:
          path: apple/.mpv/${{ env.MPV_PIN }}
          key: ci-apple-mpv-macos-ios-xcode${{ env.XCODE }}-${{ hashFiles('apple/scripts/mpv.sh', 'apple/patches/**') }}
          lookup-only: ${{ github.event_name == 'push' }}
      - name: libmpv
        if: env.CHECKS == 'true' || steps.mpv.outputs.cache-hit != 'true'
        run: apple/scripts/mpv.sh macos ios
      - name: Keep libmpv
        if: github.ref == 'refs/heads/main' && steps.mpv.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: apple/.mpv/${{ env.MPV_PIN }}
          key: ${{ steps.mpv.outputs.cache-primary-key }}

      # Swift: the player's tests play media apple/scripts/player-media.sh makes with ffmpeg.
      - name: Swift, ffmpeg for the player's media
        if: env.CHECKS == 'true'
        run: brew install ffmpeg
      # First, so a Swift change that does not compile says so in minutes. The deployment target
      # is the engine's, so the Rust tests below share its build.
      - name: Swift, the packages' tests
        if: env.CHECKS == 'true'
        env:
          MACOSX_DEPLOYMENT_TARGET: "26.0"
        run: apple/scripts/test.sh
      # What test.sh builds first, for the cache.
      - name: The testing engine
        if: env.CHECKS != 'true' && steps.engine.outputs.cache-hit != 'true'
        env:
          MACOSX_DEPLOYMENT_TARGET: "26.0"
        run: apple/scripts/engine.sh testing macos
      # The Fixtures app from the XcodeGen project, its tests on the Mac (Swift Testing over the
      # testing engine test.sh built, signed to run locally), with the libmpv and subtitle font
      # test.sh made for the player's tests.
      - name: The project
        if: ${{ !cancelled() && env.CHECKS == 'true' }}
        run: cd apple && xcodegen generate
      - name: Swift, the Fixtures app on the Mac
        if: ${{ !cancelled() && env.CHECKS == 'true' }}
        env:
          MACOSX_DEPLOYMENT_TARGET: "26.0"
        run: >-
          xcodebuild -project apple/Anistream.xcodeproj -scheme "Anistream Fixtures"
          -destination platform=macOS test
      # The Mac player's controls clicked as a person clicks them (apple/MacPlayerTests): XCUITest
      # moves the pointer and presses through the window server, where the window's title bar can
      # take a click before a control does. XCTest drives apps only in automation mode, which the
      # runner's image turns on without a password; where it has not, it is turned on here, and
      # where it cannot be, the step fails saying so rather than waiting on a password prompt.
      # Time-boxed all the same: a run that hangs ends with the step, not the job.
      - name: Swift, the Mac player's controls clicked
        if: ${{ !cancelled() && env.CHECKS == 'true' }}
        timeout-minutes: 20
        env:
          MACOSX_DEPLOYMENT_TARGET: "26.0"
        run: |
          if automationmodetool | grep -q "requires user authentication"; then
            sudo -n automationmodetool enable-automationmode-without-authentication || {
              echo "::error::automation mode needs a password on this runner, so XCTest cannot drive the app"
              exit 1
            }
          fi
          xcodebuild -project apple/Anistream.xcodeproj -scheme "Anistream Mac Player" \
            -destination platform=macOS -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 420 \
            -resultBundlePath "$RUNNER_TEMP/mac-player.xcresult" test
      # What a failed click saw: XCTest keeps a screenshot of the screen at each failure in the
      # result bundle, which Xcode opens.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: mac-player-clicks
          path: ${{ runner.temp }}/mac-player.xcresult
          if-no-files-found: ignore
          retention-days: 7
      # The apps build the engine without the desktop feature, so its hosted player has to pass
      # its contract in that build too: the FFI's own tests in the build test.sh just made, with
      # the features, target and profile engine.sh gives the Mac's slice, so nothing beneath the
      # FFI compiles again. Only when the engine changed: a change to apple/ alone cannot move
      # them. Without the image's ANDROID_NDK_HOME, as engine.sh's clean environment has it:
      # BoringSSL's build script watches it, and seeing it change built BoringSSL again.
      - name: Swift, Rust tests, the apps' build
        if: ${{ !cancelled() && env.CHECKS == 'true' && needs.changes.outputs.engine == 'true' }}
        env:
          MACOSX_DEPLOYMENT_TARGET: "26.0"
        run: >-
          env -u ANDROID_NDK_HOME
          cargo test -p anistream-ffi --no-default-features --features testing,cli
          --target aarch64-apple-darwin --profile app-dev

      # Apple: the engines the apps ship, the schemes' pre-actions build these too, but quietly,
      # into a log; built here, a failure says why in the job.
      - name: Apple, the engines
        if: ${{ !cancelled() && (env.CHECKS == 'true' || steps.engine.outputs.cache-hit != 'true') }}
        run: apple/scripts/engine.sh release macos ios
      # Every slice above, testing and release, for the pull requests after this push.
      - name: Keep the engines
        if: github.ref == 'refs/heads/main' && steps.engine.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/anistream-engine/apple
          key: ${{ steps.engine.outputs.cache-primary-key }}
      # The CJK subtitle font the iOS app bundles, which its iOS builds check for.
      - name: Apple, the subtitle font
        if: ${{ !cancelled() && env.CHECKS == 'true' }}
        run: apple/scripts/fonts.sh
      - name: Apple, the app for an iPhone
        if: ${{ !cancelled() && env.CHECKS == 'true' }}
        run: >-
          xcodebuild -project apple/Anistream.xcodeproj -scheme Anistream
          -destination generic/platform=iOS build CODE_SIGNING_ALLOWED=NO
      # In Release, as the app is kept, on the app-dev engine above (ANISTREAM_ENGINE_PROFILE
      # names the profile the Release configuration's engine check expects).
      - name: Apple, the app for the Mac in Release
        if: ${{ !cancelled() && env.CHECKS == 'true' }}
        run: >-
          xcodebuild -project apple/Anistream.xcodeproj -scheme Anistream -configuration Release
          -destination platform=macOS build CODE_SIGNING_ALLOWED=NO ANISTREAM_ENGINE_PROFILE=app-dev

  # The Android app: its engine and Kotlin bindings as android/scripts/engine.sh builds them, with
  # the runner's newest NDK through cargo-ndk, which points every C build at the NDK's clang for
  # API level 35, the Android app's minimum; the library checked for what Android needs of it; the
  # fixtures APK; and the JVM unit tests, which start the testing engine on this runner's own build
  # of the library through JNA. Emulator tests come later.
  #
  # The app's engine comes from a cache saved on main, keyed by what engine.sh builds it from, so
  # a pull request that leaves the engine's crates alone compiles none.
  # The Windows app: the engine for x86_64-pc-windows-msvc and the C# bindings generated from it,
  # the C# tests of the engine's bindings and of the app's logic, then the app itself built
  # against them. Its libmpv is the pinned download libmpv.ps1 checks by SHA-256. The windows-latest
  # runner is x64, so the app is built here for x64; the ARM64 build is the same code.
  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: tools/ci-toolchain.sh
        shell: bash
      - uses: ilammy/setup-nasm@v1
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # Only main saves, as in the jobs above.
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-app
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The bindings generator, built once per pin and patch series: bindings.sh keeps it in
      # ~/.cache/anistream-bindgen-cs, by a key of that pin and those patches.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/anistream-bindgen-cs
          key: ci-bindgen-cs-${{ hashFiles('desktop/windows/bindgen-cs/**') }}
      # libmpv, from mpv's development builds, whose file names carry the commit. The cache is
      # keyed by the script, whose pin and checksum are the file's; a miss fetches and verifies.
      - uses: actions/cache@v6
        with:
          path: desktop/windows/.libmpv
          key: ci-libmpv-x64-${{ hashFiles('desktop/windows/scripts/libmpv.ps1') }}
      - name: libmpv
        run: ./desktop/windows/scripts/libmpv.ps1 -Arch x64
        shell: pwsh
      # The testing engine, the generated bindings and both C# test projects, under a temporary
      # profile, as scripts/test.sh does everywhere.
      - name: Test
        run: desktop/windows/scripts/test.sh
        shell: bash
      # The app, against the bindings the tests just used. Building is the check: the XAML
      # compiler and the C# compiler both have to accept every page.
      - name: Build the app
        run: >-
          dotnet build desktop/windows/Anistream.Windows -c Release -p:Platform=x64 -r win-x64
          -p:EngineFlavour=testing
        shell: bash

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Both of the APKs' ABIs, as engine.sh builds them: arm64 and the TV boxes' 32-bit ARM.
      - run: tools/ci-toolchain.sh aarch64-linux-android armv7-linux-androideabi
      # The newest NDK the runner has, which links 16 KB aligned (r28 and later), where
      # ANDROID_NDK_HOME may name an older one. And bindgen's clang arguments, for BoringSSL's
      # bindings: bindgen asks clang for the Rust target as it is named, without an API level,
      # and the NDK's headers refuse an unversioned one. cargo-ndk 4 sets the underscored
      # BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android itself, to the sysroot alone, over any
      # value given it, so the level goes in the hyphenated name, which bindgen reads first, with
      # the sysroot beside it.
      - name: The NDK and bindgen's arguments for it
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          sysroot="$ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          {
            echo "ANDROID_NDK_HOME=$ndk"
            echo "NDK_VERSION=$(basename "$ndk")"
            echo "BINDGEN_ANDROID=--target=aarch64-linux-android35 --sysroot=$sysroot -I$sysroot/usr/include/aarch64-linux-android"
          } >> "$GITHUB_ENV"
      # What the engine is built from, as engine.sh hashes it: only the crates it compiles.
      - name: The engine's sources
        id: sources
        run: echo "hash=$(android/scripts/engine.sh --sources-hash)" >> "$GITHUB_OUTPUT"
      # engine.sh's own cache of the testing engine (~/.cache/anistream-engine), by that hash and
      # the NDK that built it. Saved below, from main only.
      - name: Restore the app's engine
        id: engine
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/anistream-engine/android
          key: ci-android-engine-ndk${{ env.NDK_VERSION }}-${{ steps.sources.outputs.hash }}
      # Not read when the engine came from the cache above, since nothing compiles.
      - uses: Swatinem/rust-cache@v2
        if: steps.engine.outputs.cache-hit != 'true'
        with:
          key: android
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # Gradle's caches and the wrapper's distribution, saved from main like the Rust cache.
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # The platform the app compiles against, and the NDK its build.gradle.kts strips the APK's
      # libraries with; the engine itself builds with the newest NDK, above.
      - name: The SDK platform and NDK the app builds with
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" "ndk;30.0.16248370" >/dev/null
      # The fixtures flavour's engine and its bindings, which engine.sh builds with the same
      # bindgen arguments, and the fonts.
      - name: The app's engine and bindings
        run: android/scripts/engine.sh testing
        env:
          # The workspace's own, which the Rust cache keeps, rather than the script's default in HOME.
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # The library the APK carries: Android 15 devices can run 16 KB pages, and a library with
      # 4 KB aligned segments does not load on them. And a library that needed libc++_shared.so
      # would have the app ship it.
      - name: The library loads on 16 KB pages and needs only the system's libraries
        if: github.event_name == 'pull_request'
        run: |
          bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          so=android/.engine/testing/jniLibs/arm64-v8a/libanistream_ffi.so
          "$bin/llvm-readelf" -d "$so" | grep NEEDED
          if "$bin/llvm-readelf" -d "$so" | grep -q 'libc++_shared'; then
            echo "the library needs libc++_shared.so, which the app would have to ship"; exit 1
          fi
          if "$bin/llvm-objdump" -p "$so" | grep LOAD | grep -vq 'align 2\*\*14'; then
            echo "a LOAD segment is not 16 KB aligned"; exit 1
          fi
      - name: Keep the app's engine
        if: github.ref == 'refs/heads/main' && steps.engine.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/anistream-engine/android
          key: ${{ steps.engine.outputs.cache-primary-key }}
      - name: The app's fonts
        run: android/scripts/fonts.sh
      # The Android builds Robolectric draws the screenshot tests on, which it fetches itself.
      # Saved from main only, like every other cache here.
      - name: Restore Robolectric's Android builds
        id: robolectric
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('android/gradle/libs.versions.toml') }}
          lookup-only: ${{ github.event_name == 'push' }}
      # libmpv is built by android/scripts/mpv.sh on a developer's Mac, not here: the player module
      # builds without it and its JNI shim, so its Kotlin compiles and its unit tests run. On main
      # only when Robolectric's builds have to be fetched for its cache, which the tests do.
      - name: The fixtures APK and the unit tests
        if: github.event_name == 'pull_request' || steps.robolectric.outputs.cache-hit != 'true'
        working-directory: android
        run: ./gradlew --console=plain assembleFixturesDebug testFixturesDebugUnitTest -Proborazzi.test.record=true
        env:
          ANISTREAM_PLAYER_NATIVE: "off"
      # Otherwise main builds the same, tests and all, and runs none, for Gradle's cache.
      - name: The fixtures APK and the unit tests' build
        if: github.event_name == 'push' && steps.robolectric.outputs.cache-hit == 'true'
        working-directory: android
        run: ./gradlew --console=plain assembleFixturesDebug compileFixturesDebugUnitTestKotlin
        env:
          ANISTREAM_PLAYER_NATIVE: "off"
      - name: Keep Robolectric's Android builds
        if: github.ref == 'refs/heads/main' && steps.robolectric.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.robolectric.outputs.cache-primary-key }}
      # The screenshot tests' captures, each board's screen drawn from a recorded scene, to look
      # at beside the boards.
      - uses: actions/upload-artifact@v7
        if: always() && github.event_name == 'pull_request'
        with:
          name: android-screenshots
          path: android/.shots/roborazzi/
          if-no-files-found: ignore

  # The plugin store's admin page is committed as built output, so building the server never
  # needs bun. This rebuilds it from source and fails if the two have drifted apart.
  admin-page:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/anistream-store-core/admin
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - name: The committed build matches its source
        run: git diff --exit-code -- ../assets/admin

  # The serverless deploy templates carry the store as committed WebAssembly, so deploying one
  # from its button never needs Rust. The package cannot be compared byte for byte with a build
  # here: cargo mixes the host into every crate's identity, and wasm-bindgen's exported names
  # carry it. So sync.sh records the sources it built from, this fails with a diff when they have
  # moved on or a template's copy differs, and the build below proves it still compiles.
  # store-templates runs the committed copies through the whole store journey.
  store-wasm:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup target add wasm32-unknown-unknown
      - name: The committed package matches its sources
        run: deploy/sync.sh --check
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1
      - name: It still builds
        run: >-
          wasm-pack build crates/anistream-store-wasm --release --target web
          --out-dir "$RUNNER_TEMP/store-wasm" --out-name store --no-pack

  # Each serverless template, run on the runner the way its platform runs it, through the whole
  # journey a store's owner and members take: claim, publish in parts, join, download in ranges,
  # remove, sign in to the admin page. Nothing else exercises the templates' JavaScript.
  store-templates:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      # No Rust cache: one was 300 MB for a build of one crate's test that takes under two
      # minutes without it.
      - uses: oven-sh/setup-bun@v2
      # Vercel's functions run on Node 24, and the Netlify and test hosts run on whatever node is
      # first on the path.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install each template's dependencies
        run: for dir in cloudflare vercel netlify test; do (cd "deploy/$dir" && bun install --frozen-lockfile); done
      - run: deploy/test/journeys.sh

  audit:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A prebuilt binary: compiling cargo-audit from source took two minutes per run.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Advisory policy lives in .cargo/audit.toml, where each ignore carries its
      # justification — a silent pass would defeat the point of running this. Invoked
      # directly rather than through `cargo`, which would install the pinned toolchain only
      # to read Cargo.lock.
      - run: cargo-audit audit

  # Every Rust crate's licence, as a release collects them for the terminal binaries and for the
  # apps (packaging/rust-licences): a crate under a licence about.toml does not accept, or whose
  # licence cannot be read, fails here rather than in a release.
  licences:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - name: The terminal's
        run: >-
          packaging/rust-licences/generate.sh terminal "$RUNNER_TEMP/terminal.txt"
          x86_64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc
      - name: The apps'
        run: packaging/rust-licences/generate.sh apps "$RUNNER_TEMP/apps.txt"
      - name: The Windows app's
        run: packaging/rust-licences/generate.sh windows "$RUNNER_TEMP/windows.txt"
      - name: The Linux app's
        run: packaging/rust-licences/generate.sh linux "$RUNNER_TEMP/linux.txt"

  # The one check main requires, so GitHub's auto-merge can merge a pull request once it is
  # green. It waits for every other check on the pull request's head commit, whichever workflow
  # or app reports it (the apps' release builds, the release build, the store image and
  # Cloudflare Pages run only when their paths change), and fails if any of them did. Skipped
  # and neutral count as passed.
  passed:
    name: CI passed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      checks: read
      statuses: read
    steps:
      - name: Wait for every other check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        # A job that needs another has no check until that one finishes, as the mpv jobs need the
        # linux job's build. So a moment with nothing waiting can fall just before such a check
        # appears, and this passes only when a second look 20 seconds on finds the same checks,
        # all of them done.
        run: |
          sleep 30
          seen=""
          while true; do
            runs="$(gh api --paginate "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
              --jq '.check_runs[] | select(.name != "CI passed") | [.name, .status, (.conclusion // "")] | @tsv')"
            statuses="$(gh api "repos/$REPO/commits/$SHA/status" \
              --jq '.statuses[] | [.context, (if .state == "pending" then "in_progress" else "completed" end), .state] | @tsv')"
            all="$(printf '%s\n%s\n' "$runs" "$statuses" | sed '/^$/d' | sort)"
            failed="$(awk -F'\t' '$2 == "completed" && $3 !~ /^(success|skipped|neutral)$/' <<<"$all")"
            if [ -n "$failed" ]; then
              echo "::error::Checks that did not pass:"; echo "$failed"; exit 1
            fi
            waiting="$(awk -F'\t' '$2 != "completed"' <<<"$all")"
            if [ -z "$waiting" ]; then
              if [ "$all" = "$seen" ]; then
                echo "All $(wc -l <<<"$all" | tr -d ' ') other checks passed."; exit 0
              fi
              seen="$all"
              sleep 20
              continue
            fi
            seen=""
            echo "Waiting on $(wc -l <<<"$waiting" | tr -d ' '): $(cut -f1 <<<"$waiting" | paste -sd, - | cut -c1-300)"
            sleep 60
          done
