name: Apps release

# The apps a release ships beside the terminal binaries: the Android APK, the Mac app in a .dmg
# and the iPhone and iPad app as an .ipa for AltStore or SideStore to sign, with the notices for
# the LGPL libmpv and FFmpeg inside them and for the engine's Rust crates, and the source those
# libraries were built from. release.yml calls this for each release, from the commit it releases
# and with the tag it will make, and publishes what it built once every build has succeeded.
# This workflow never publishes anything itself.
#
# Each release also carries how the apps update: the Mac's appcast, which offers its .dmg signed
# with the Mac update key for Sparkle in the app, and the source SideStore and AltStore install
# the iPhone and iPad app from. Both are named without a version, so releases/latest/download/
# always has the newest.
#
# Its own runs are dry runs, which build everything a release would and keep the files on the run
# for a week: a pull request that changes how the apps are built or packaged, and a dispatch.
# A dry run uses the Android release key and the Mac update key when the repository's secrets
# reach it, and leaves the APK unsigned and makes no appcast, saying so, when they do not, as on a
# pull request from a fork.
#
# Nothing here is cached by cargo. Each engine is kept by engine.sh's own cache, keyed by the Rust
# sources with the version a release sets in Cargo.toml, and libmpv by its build script and
# patches. Runs on main keep their engines, so a release's run that is run again reuses them.
on:
  workflow_call:
    inputs:
      tag:
        description: The release's tag, which the apps are numbered by. It is made once they are built.
        required: true
        type: string
      ref:
        description: The commit the release is built from
        required: true
        type: string
    secrets:
      ANDROID_RELEASE_KEYSTORE_BASE64:
        required: true
      ANDROID_RELEASE_STORE_PASSWORD:
        required: true
      ANDROID_RELEASE_KEY_ALIAS:
        required: true
      ANDROID_RELEASE_KEY_PASSWORD:
        required: true
      # The Ed25519 key the Mac app's update and its appcast are signed with: the 32-byte seed in
      # base64, whose public half is SUPublicEDKey in apple/App/Info.plist.
      MAC_UPDATE_ED25519_KEY:
        required: true
  # What decides how a release is built and packaged. CI's own jobs already build the apps for
  # everything else, in Debug and for the Simulator. The patches and libmpv.map count as mpv's
  # build script, which reads them.
  pull_request:
    paths:
      - .github/workflows/apps-release.yml
      - .github/workflows/release.yml
      - packaging/**
      - apple/project.yml
      - apple/App/Info.plist
      - apple/scripts/engine.sh
      - apple/scripts/mpv.sh
      - apple/scripts/adhoc-sign.sh
      - apple/patches/**
      - android/app/build.gradle.kts
      - android/gradle/libs.versions.toml
      - android/scripts/engine.sh
      - android/scripts/mpv.sh
      - android/mpv/**
  workflow_dispatch:
    inputs:
      tag:
        description: A tag to build as its release would, numbered by it. Empty builds the branch as 0.0.0.
        required: false
        type: string
      dry_run:
        description: Build and publish nothing. This workflow only dry-runs; release.yml publishes.
        required: true
        type: boolean
        default: true

# A newer push to a pull request makes its running builds moot. Every other run is a group of its
# own. Not named after github.workflow, which is release.yml's when it calls this: the two would
# share a group and cancel each other.
concurrency:
  group: apps-release-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Empty on a pull request, and on a dispatch without one: the apps are then 0.0.0.
  TAG: ${{ inputs.tag }}
  # A release is release.yml's call, the one run with no dry_run input at all.
  RELEASE: ${{ github.event_name != 'pull_request' && toJSON(inputs.dry_run) == 'null' }}
  # The engines the apps ship, in cargo's release profile, which their builds check for.
  ANISTREAM_ENGINE_PROFILE: release

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      ANISTREAM_ENGINE_CACHE: ${{ github.workspace }}/.cache/engine
      BUILD_TOOLS: "36.0.0"
    steps:
      - name: Only a dry run
        if: toJSON(inputs.dry_run) == 'false'
        run: |
          echo "::error::This workflow builds without publishing. release.yml publishes a release for each push to main."
          exit 1

      # `inputs.ref` is release.yml's commit. A dispatch has none, and builds its tag, or with no
      # tag either, like a pull request, the ref that started the run.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || inputs.tag }}

      - name: The version
        run: |
          version="$(packaging/apps/version.sh "$TAG")"
          echo "$version" | tee -a "$GITHUB_ENV"
      # So the engine says the release's version, as the terminal's binaries do. Before the
      # engine's cache key is made from the sources. A run with no tag keeps the workspace's own.
      - name: The workspace's version
        if: env.TAG != ''
        run: packaging/set-version.sh "$VERSION"

      # Room for two release builds of the engine, libmpv's and Gradle's, on a runner that starts
      # with a fraction of its disk free.
      - name: Room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - run: rustup toolchain install && rustup target add aarch64-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # fontconfig's build runs gperf; mpv.sh keeps meson, ninja and pkgconf in a venv of its own.
      - name: libmpv's build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gperf python3-venv

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # Reads main's Gradle caches and writes none: a run with the release key in it leaves
      # nothing behind.
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      # The NDK and CMake gradle/libs.versions.toml pins. The engine and libmpv build with that
      # same NDK, which ANDROID_NDK_HOME names for both scripts and for Gradle's checks of them.
      - name: The SDK platform, NDK and CMake the app builds with
        run: |
          versions=android/gradle/libs.versions.toml
          ndk="$(sed -n 's/^ndk = "\(.*\)"$/\1/p' "$versions")"
          cmake="$(sed -n 's/^cmake = "\(.*\)"$/\1/p' "$versions")"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;$BUILD_TOOLS" \
            "ndk;$ndk" "cmake;$cmake" >/dev/null
          {
            echo "NDK_VERSION=$ndk"
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk"
          } >> "$GITHUB_ENV"

      # libmpv and FFmpeg, six minutes from source, kept by what mpv.sh's stamp is made from: only
      # the pin's build, which mpv.sh links as android/.mpv/current again when it finds it current.
      - name: libmpv's pin
        run: echo "MPV_PIN=$(sed -n 's/^pin=//p' android/scripts/mpv.sh)" >> "$GITHUB_ENV"
      - name: Restore libmpv
        id: mpv
        uses: actions/cache/restore@v6
        with:
          path: android/.mpv/${{ env.MPV_PIN }}
          key: apps-android-mpv-ndk${{ env.NDK_VERSION }}-${{ hashFiles('android/scripts/mpv.sh', 'android/mpv/**') }}
      - name: libmpv
        run: android/scripts/mpv.sh
      - name: Keep libmpv
        if: steps.mpv.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: android/.mpv/${{ env.MPV_PIN }}
          key: ${{ steps.mpv.outputs.cache-primary-key }}

      # engine.sh's cache, keyed by what its stamp is made from. Kept from main's runs only: a pull
      # request's would push main's own caches out of the repository's quota, and a tag's could be
      # read by no other run.
      - name: Restore the engine
        id: engine
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.ANISTREAM_ENGINE_CACHE }}
          key: apps-android-engine-ndk${{ env.NDK_VERSION }}-${{ hashFiles('crates/**', 'wit/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'android/scripts/engine.sh') }}
      - name: The engine
        run: android/scripts/engine.sh release
      - name: Keep the engine
        if: steps.engine.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.ANISTREAM_ENGINE_CACHE }}
          key: ${{ steps.engine.outputs.cache-primary-key }}

      - name: The fonts
        run: android/scripts/fonts.sh

      # The keystore goes to a file of the runner's, and its passwords only into the step that
      # builds, never into the environment the other steps share.
      - name: The release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE" ]]; then
            if [[ "$RELEASE" == true ]]; then
              echo "::error::A release needs the ANDROID_RELEASE_* secrets, and this run has none."
              exit 1
            fi
            echo "::warning::No release key reaches this run, so the APK is left unsigned."
            exit 0
          fi
          keystore="$RUNNER_TEMP/anistream-release.p12"
          printf '%s' "$KEYSTORE" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      # The `app` flavour in release, with the engine and libmpv above. The configuration cache is
      # off, so the key's passwords are never written into it.
      - name: The APK
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_ANISTREAM_VERSION_NAME: ${{ env.VERSION }}
          ORG_GRADLE_PROJECT_ANISTREAM_VERSION_CODE: ${{ env.BUILD_NUMBER }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -n "${KEYSTORE_FILE:-}" ]]; then
            export ORG_GRADLE_PROJECT_ANISTREAM_RELEASE_STORE_FILE="$KEYSTORE_FILE"
            export ORG_GRADLE_PROJECT_ANISTREAM_RELEASE_STORE_PASSWORD="$STORE_PASSWORD"
            export ORG_GRADLE_PROJECT_ANISTREAM_RELEASE_KEY_ALIAS="$KEY_ALIAS"
            export ORG_GRADLE_PROJECT_ANISTREAM_RELEASE_KEY_PASSWORD="$KEY_PASSWORD"
          fi
          ./gradlew --console=plain --no-configuration-cache :app:assembleAppRelease

      # Gradle signs the APK when the app's build has the release signing config and the key's
      # properties. An APK it left unsigned is signed here with the same key, keeping the 16 KB
      # alignment Gradle gave its libraries. Then it is checked: signed, aligned, numbered by the
      # tag, and carrying the engine, libmpv and the player's licences.
      - name: Sign and check the APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          built=android/app/build/outputs/apk/app/release
          ls -l "$built"
          mkdir -p dist
          name="anistream-$VERSION-android-arm64"
          if [[ -f "$built/app-app-release.apk" ]]; then
            cp "$built/app-app-release.apk" "dist/$name.apk"
          elif [[ -n "${KEYSTORE_FILE:-}" ]]; then
            "$tools/apksigner" sign --alignment-preserved --v4-signing-enabled false \
              --ks "$KEYSTORE_FILE" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
              --out "dist/$name.apk" "$built/app-app-release-unsigned.apk"
          else
            name="$name-unsigned"
            cp "$built/app-app-release-unsigned.apk" "dist/$name.apk"
          fi
          apk="dist/$name.apk"

          if [[ -n "${KEYSTORE_FILE:-}" ]]; then
            "$tools/apksigner" verify --min-sdk-version 35 "$apk"
          fi
          "$tools/zipalign" -c -P 16 4 "$apk"
          badging="$("$tools/aapt2" dump badging "$apk" | head -1)"
          echo "$badging"
          [[ "$badging" == *"name='tv.anistream.app'"* ]]
          [[ "$badging" == *"versionCode='$BUILD_NUMBER'"* && "$badging" == *"versionName='$VERSION'"* ]] ||
            { echo "::error::The APK is not numbered $VERSION ($BUILD_NUMBER)"; exit 1; }
          contents="$(unzip -l "$apk")"
          for entry in lib/arm64-v8a/libanistream_ffi.so lib/arm64-v8a/libmpv.so \
            lib/arm64-v8a/libavcodec.so lib/arm64-v8a/libanistream_mpv.so \
            assets/licences/player/NOTICE assets/licences/RobotoFlex-OFL.txt; do
            grep -q " $entry\$" <<<"$contents" || { echo "::error::The APK has no $entry"; exit 1; }
          done
          (cd dist && sha256sum "$name.apk" > "$name.apk.sha256")

      - name: Forget the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/anistream-release.p12"

      # What libmpv was built from and the licences it collected, for the notices.
      - name: The build's record
        run: |
          mkdir -p record/android
          cp -R android/.mpv/current/stamp android/.mpv/current/features \
            android/.mpv/current/contents android/.mpv/current/licenses record/android/
          cp -R android/.fonts/assets/licences record/android/fonts

      - uses: actions/upload-artifact@v7
        with:
          name: apps-android
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: record-android
          path: record/
          if-no-files-found: error
          retention-days: 7

      - name: Sizes
        if: always()
        run: |
          {
            echo "### Android"
            echo
            echo '```'
            ls -l dist 2>/dev/null || true
            df -h / | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apple:
    name: Mac, iPhone and iPad
    # The image and the Xcode the apple job in ci.yml builds with, 27.1, the one the app is
    # developed with, so a release is built by the compiler that was tested.
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      XCODE: "27.1"
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      ANISTREAM_ENGINE_CACHE: ${{ github.workspace }}/.cache/engine
    steps:
      - name: Only a dry run
        if: toJSON(inputs.dry_run) == 'false'
        run: |
          echo "::error::This workflow builds without publishing. release.yml publishes a release for each push to main."
          exit 1

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || inputs.tag }}

      - name: The version
        run: |
          version="$(packaging/apps/version.sh "$TAG")"
          echo "$version" | tee -a "$GITHUB_ENV"
      - name: The workspace's version
        if: env.TAG != ''
        run: packaging/set-version.sh "$VERSION"

      # rust-toolchain.toml lists the iOS targets.
      - run: rustup toolchain install
      - run: xcodebuild -version
      - run: brew install xcodegen

      # Mpv.framework for the Mac and the iPhone, kept by what mpv.sh's stamp is made from: only
      # the pin's build, which mpv.sh links as apple/.mpv/current again when it finds it current.
      - name: libmpv's pin
        run: echo "MPV_PIN=$(sed -n 's/^mpvkit=//p' apple/scripts/mpv.sh)" >> "$GITHUB_ENV"
      - name: Restore libmpv
        id: mpv
        uses: actions/cache/restore@v6
        with:
          path: apple/.mpv/${{ env.MPV_PIN }}
          key: apps-apple-mpv-xcode${{ env.XCODE }}-${{ hashFiles('apple/scripts/mpv.sh', 'apple/patches/**') }}
      - name: libmpv
        run: apple/scripts/mpv.sh macos ios
      - name: Keep libmpv
        if: steps.mpv.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: apple/.mpv/${{ env.MPV_PIN }}
          key: ${{ steps.mpv.outputs.cache-primary-key }}

      # The release engine for both, as the Release configuration checks for it. The Mac's slice
      # is the one the Swift bindings are generated from.
      - name: Restore the engine
        id: engine
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.ANISTREAM_ENGINE_CACHE }}
          key: apps-apple-engine-xcode${{ env.XCODE }}-${{ hashFiles('crates/**', 'wit/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'apple/scripts/engine.sh') }}
      - name: The engine
        run: apple/scripts/engine.sh release macos ios
      - name: Keep the engine
        if: steps.engine.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.ANISTREAM_ENGINE_CACHE }}
          key: ${{ steps.engine.outputs.cache-primary-key }}

      - name: The subtitle font
        run: apple/scripts/fonts.sh
      - name: The project
        run: cd apple && xcodegen generate

      # Built unsigned, then signed ad hoc from the inside out by adhoc-sign.sh: each framework,
      # the widget extension with its sandbox, then the app, and verified. No Apple developer
      # account signs it, so it is not notarized either.
      #
      # Nor has it a team, which the Mac's App Group is prefixed by (ANISTREAM_APP_GROUP), so it
      # has no group: the setting comes out as `.tv.anistream`, which the app and the widgets take
      # for none, and the script signs neither with the group's entitlement, which macOS would
      # ask about on every start. The app writes the widgets nothing; they load, sandboxed, and
      # show their empty state, Airing today with AniList's public schedule. A signed build with
      # a team gets the widgets their snapshot.
      - name: The Mac app
        id: mac
        run: |
          xcodebuild -quiet -project apple/Anistream.xcodeproj -scheme Anistream \
            -configuration Release -destination generic/platform=macOS \
            -derivedDataPath "$RUNNER_TEMP/mac" \
            MARKETING_VERSION="$APPLE_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            DEVELOPMENT_TEAM= CODE_SIGNING_ALLOWED=NO build
          app="$RUNNER_TEMP/mac/Build/Products/Release/Anistream.app"
          apple/scripts/adhoc-sign.sh "$app"
          echo "APP_MAC=$app" >> "$GITHUB_ENV"

      # For a generic iPhone and iPad with signing off, then signed ad hoc by adhoc-sign.sh like the
      # Mac's, with the app's and the widgets' entitlements: the App Group, group.tv.anistream.
      # No device installs it so. AltStore and SideStore read those entitlements from the
      # signature, register the group under the person's own team as group.tv.anistream.<team>,
      # which the app and the widgets look for, and sign it again with their Apple ID as they
      # install it. Built when the Mac's build failed too, so one run says what fails on each.
      - name: The iPhone and iPad app
        if: success() || steps.mac.conclusion == 'failure'
        run: |
          xcodebuild -quiet -project apple/Anistream.xcodeproj -scheme Anistream \
            -configuration Release -destination generic/platform=iOS \
            -derivedDataPath "$RUNNER_TEMP/ios" \
            MARKETING_VERSION="$APPLE_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO build
          app="$RUNNER_TEMP/ios/Build/Products/Release-iphoneos/Anistream.app"
          apple/scripts/adhoc-sign.sh "$app"
          echo "APP_IOS=$app" >> "$GITHUB_ENV"

      # Each numbered by the tag and carrying libmpv with its notices and the widget extension,
      # numbered as the app is; the iPhone's its subtitle font.
      - name: Check the apps
        run: |
          check() {
            local plist="$1" key="$2" want="$3" got
            got="$(/usr/libexec/PlistBuddy -c "Print :$key" "$plist")"
            [[ "$got" == "$want" ]] || { echo "::error::$plist has $key $got, not $want"; exit 1; }
          }
          for plist in "$APP_MAC/Contents/Info.plist" "$APP_IOS/Info.plist"; do
            check "$plist" CFBundleShortVersionString "$APPLE_VERSION"
            check "$plist" CFBundleVersion "$BUILD_NUMBER"
            check "$plist" CFBundleIdentifier tv.anistream.app
          done
          for plist in "$APP_MAC/Contents/PlugIns/AnistreamWidgets.appex/Contents/Info.plist" \
            "$APP_IOS/PlugIns/AnistreamWidgets.appex/Info.plist"; do
            check "$plist" CFBundleShortVersionString "$APPLE_VERSION"
            check "$plist" CFBundleVersion "$BUILD_NUMBER"
            check "$plist" CFBundleIdentifier tv.anistream.app.widgets
          done
          # The Mac's updater, and the key and feed it trusts.
          check "$APP_MAC/Contents/Info.plist" SUFeedURL \
            "https://github.com/bitknox/anistream/releases/latest/download/appcast.xml"
          check "$APP_MAC/Contents/Info.plist" SUEnableAutomaticChecks false
          /usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" "$APP_MAC/Contents/Info.plist" >/dev/null
          for file in "$APP_MAC/Contents/Frameworks/Mpv.framework/Versions/A/Mpv" \
            "$APP_MAC/Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle" \
            "$APP_MAC/Contents/Resources/NOTICES-libmpv.txt" \
            "$APP_IOS/Frameworks/Mpv.framework/Mpv" "$APP_IOS/NOTICES-libmpv.txt" \
            "$APP_IOS/NOTICES-fonts.txt" "$APP_IOS/SubtitleFonts/NotoSansCJKsc-Regular.otf"; do
            [[ -f "$file" ]] || { echo "::error::No $file"; exit 1; }
          done
          lipo -info "$APP_MAC/Contents/MacOS/Anistream"

      # The app and a link to Applications to drag it to. hdiutil on a hosted runner now and then
      # finds the image busy, so it gets three tries.
      - name: The .dmg and the .ipa
        run: |
          mkdir -p dist "$RUNNER_TEMP/dmg" "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP_MAC" "$RUNNER_TEMP/dmg/Anistream.app"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          dmg="anistream-$VERSION-macos.dmg"
          for attempt in 1 2 3; do
            hdiutil create -volname "Anistream $VERSION" -srcfolder "$RUNNER_TEMP/dmg" \
              -format UDZO -ov "dist/$dmg" && break
            (( attempt < 3 )) || exit 1
            sleep 10
          done
          hdiutil verify "dist/$dmg"

          ipa="anistream-$VERSION-ios-unsigned.ipa"
          ditto "$APP_IOS" "$RUNNER_TEMP/ipa/Payload/Anistream.app"
          (cd "$RUNNER_TEMP/ipa" && zip -qry -X "$GITHUB_WORKSPACE/dist/$ipa" Payload)

          cd dist
          for file in "$dmg" "$ipa"; do shasum -a 256 "$file" > "$file.sha256"; done

      # The key goes to a file of the runner's, never into the environment the other steps share.
      - name: The Mac update key
        env:
          KEY: ${{ secrets.MAC_UPDATE_ED25519_KEY }}
        run: |
          if [[ -z "$KEY" ]]; then
            if [[ "$RELEASE" == true ]]; then
              echo "::error::A release needs the MAC_UPDATE_ED25519_KEY secret, and this run has none."
              exit 1
            fi
            echo "::warning::No Mac update key reaches this run, so it makes no appcast."
            exit 0
          fi
          key="$RUNNER_TEMP/mac-update.key"
          (umask 077 && printf '%s' "$KEY" > "$key")
          echo "MAC_UPDATE_KEY_FILE=$key" >> "$GITHUB_ENV"

      # The Mac's appcast, with the .dmg's EdDSA signature, checked against the key the app
      # carries, and the iPhone and iPad source, with the .ipa's size, checksum and permissions
      # (packaging/apps/mac-update.sh, packaging/apps/sidestore-source.sh).
      - name: The appcast and the SideStore source
        run: |
          packaging/apps/sidestore-source.sh "$TAG" "$APP_IOS" "dist/anistream-$VERSION-ios-unsigned.ipa" dist
          if [[ -n "${MAC_UPDATE_KEY_FILE:-}" ]]; then
            # Sparkle's tools, from the package the Mac build resolved, checked by its checksum.
            bin="$RUNNER_TEMP/mac/SourcePackages/artifacts/sparkle/Sparkle/bin"
            if [[ -x "$bin/sign_update" ]]; then export SPARKLE_BIN="$bin"; fi
            packaging/apps/mac-update.sh "$TAG" "$APP_MAC" "dist/anistream-$VERSION-macos.dmg" \
              "$MAC_UPDATE_KEY_FILE" dist
          fi

      - name: Forget the Mac update key
        if: always()
        run: rm -f "$RUNNER_TEMP/mac-update.key"

      - name: The build's record
        run: |
          mkdir -p record/apple
          cp apple/.mpv/current/stamp apple/.mpv/current/contents record/apple/

      - uses: actions/upload-artifact@v7
        with:
          name: apps-apple
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: record-apple
          path: record/
          if-no-files-found: error
          retention-days: 7

      - name: Sizes
        if: always()
        run: |
          {
            echo "### Mac, iPhone and iPad"
            echo
            echo '```'
            ls -l dist 2>/dev/null || true
            du -sh "${APP_MAC:-/nonexistent}" "${APP_IOS:-/nonexistent}" 2>/dev/null || true
            df -h / | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Beside the builds, since it needs none of them: the source of every library in the apps'
  # player, as the release attaches it for the LGPL (packaging/apps/sources.sh), and the licences
  # of the Rust crates in the engine (packaging/rust-licences), for the notices.
  sources:
    name: Sources and the Rust crates' licences
    runs-on: ubuntu-latest
    steps:
      - name: Only a dry run
        if: toJSON(inputs.dry_run) == 'false'
        run: |
          echo "::error::This workflow builds without publishing. release.yml publishes a release for each push to main."
          exit 1
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || inputs.tag }}
      - name: The version
        run: packaging/apps/version.sh "$TAG" >> "$GITHUB_ENV"
      - name: The workspace's version
        if: env.TAG != ''
        run: packaging/set-version.sh "$VERSION"
      - name: The libraries' sources
        run: packaging/apps/sources.sh "$VERSION" dist
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - name: The engine's Rust crates
        run: packaging/rust-licences/generate.sh apps record/rust/THIRD-PARTY-rust.txt
      - uses: actions/upload-artifact@v7
        with:
          name: apps-sources
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: record-rust
          path: record/
          if-no-files-found: error
          retention-days: 7

  # The notices for both, as one zip, and the release's notes for the apps, which the run's
  # summary shows, so a dry run's can be read before a release publishes them.
  notices:
    name: Notices and release notes
    needs: [android, apple, sources]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || inputs.tag }}
      - name: The version
        run: packaging/apps/version.sh "$TAG" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          pattern: record-*
          path: record
          merge-multiple: true
      - name: The notices and notes
        run: |
          packaging/apps/third-party.sh "$VERSION" "${TAG:-$GITHUB_SHA}" \
            record/android record/apple record/rust/THIRD-PARTY-rust.txt dist
          cat dist/apps-release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: apps-notices
          path: dist/
          if-no-files-found: error
          retention-days: 7
