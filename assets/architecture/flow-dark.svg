<svg xmlns="http://www.w3.org/2000/svg" class="ani-arch-wide" width="768" height="372" viewBox="0 0 768 372" role="img" aria-labelledby="flow-dark-title flow-dark-desc"><title id="flow-dark-title">How a title becomes an episode playing, and how it reaches your trackers</title><desc id="flow-dark-desc">Metadata comes from AniList, then Tenrai, then the cache (anistream-meta). The ID mapping gives the title an id for each source and each tracker (anistream-meta). The providers find a stream through the torrent transport, a self-hosted API or a plugin, in the order you set (anistream-providers); they are the one volatile layer. mpv plays it, over JSON IPC (anistream-player). Progress goes into the history, a SQLite database on your disk and the source of truth (anistream-store). Changes to push wait in the outbox, a queue per tracker that is kept while you are offline (anistream-store), and go to AniList, MyAnimeList, Kitsu, Simkl and Trakt (anistream-track), under the ids the ID mapping gives each tracker.</desc><rect width="768" height="372" rx="16" fill="#161a2e"/><g transform="translate(24 24)"><rect x="0.5" y="0.5" width="164" height="129" rx="10" fill="#222638" stroke="#434653" stroke-width="1"/><text x="14" y="26" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="12" font-weight="500" letter-spacing="0.06em">STABLE</text><text x="14" y="51" text-anchor="start" fill="#e4e0d6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="14" font-weight="600">Metadata</text><text x="14" y="71" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="400">AniList, then Tenrai,</text><text x="14" y="89" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="400">then the cache</text><text x="14" y="112" text-anchor="start" fill="#9298b5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400">anistream-meta</text><rect x="185.5" y="0.5" width="164" height="129" rx="10" fill="#222638" stroke="#434653" stroke-width="1"/><text x="199" y="26" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="12" font-weight="500" letter-spacing="0.06em">STABLE</text><text x="199" y="51" text-anchor="start" fill="#e4e0d6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="14" font-weight="600">ID mapping</text><text x="199" y="71" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="400">the title’s id for</text><text x="199" y="89" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="400">sources and trackers</text><text x="199" y="112" text-anchor="start" fill="#9298b5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400">anistream-meta</text><rect x="370.5" y="0.5" width="164" height="129" rx="10" fill="#222638" stroke="#434653" stroke-width="1"/><text x="384" y="26" text-anchor="start" fill="#f2a64b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="12" font-weight="500" letter-spacing="0.06em">VOLATILE</text><text x="384" y="51" text-anchor="start" fill="#e4e0d6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="14" font-weight="600">Providers</text><text x="384" y="71" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="400">torrent, remote and</text><text x="384" y="89" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="400">plugins, in order</text><text x="384" y="112" text-anchor="start" fill="#9298b5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400">anistream-providers</text><rect x="555.5" y="0.5" width="164" height="129" rx="10" fill="#222638" stroke="#434653" stroke-width="1"/><text x="569" y="26" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="12" font-weight="500" letter-spacing="0.06em">STABLE</text><text x="569" y="51" text-anchor="start" fill="#e4e0d6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="14" font-weight="600">Player</text><text x="569" y="71" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="400">mpv, over JSON IPC</text><text x="569" y="89" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="400"></text><text x="569" y="112" text-anchor="start" fill="#9298b5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400">anistream-player</text><rect x="0.5" y="194.5" width="164" height="129" rx="10" fill="#222638" stroke="#434653" stroke-width="1"/><text x="14" y="220" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="12" font-weight="500" letter-spacing="0.06em">OPT-IN</text><text x="14" y="245" text-anchor="start" fill="#e4e0d6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="14" font-weight="600">Trackers</text><text x="14" y="265" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="400">AniList, MAL, Kitsu,</text><text x="14" y="283" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="400">Simkl and Trakt</text><text x="14" y="306" text-anchor="start" fill="#9298b5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400">anistream-track</text><rect x="185.5" y="194.5" width="164" height="129" rx="10" fill="#222638" stroke="#434653" stroke-width="1"/><text x="199" y="220" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="12" font-weight="500" letter-spacing="0.06em">DURABLE</text><text x="199" y="245" text-anchor="start" fill="#e4e0d6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="14" font-weight="600">Outbox</text><text x="199" y="265" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="400">a queue per tracker,</text><text x="199" y="283" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="400">kept while offline</text><text x="199" y="306" text-anchor="start" fill="#9298b5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400">anistream-store</text><rect x="555.5" y="194.5" width="164" height="129" rx="10" fill="#222638" stroke="#434653" stroke-width="1"/><text x="569" y="220" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="12" font-weight="500" letter-spacing="0.06em">SOURCE OF TRUTH</text><text x="569" y="245" text-anchor="start" fill="#e4e0d6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="14" font-weight="600">History</text><text x="569" y="265" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="400">SQLite on your disk,</text><text x="569" y="283" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="400">no account needed</text><text x="569" y="306" text-anchor="start" fill="#9298b5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400">anistream-store</text><path d="M167 65 L183 65" fill="none" stroke="#9298b5" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M177.73 62.12 L183 65 L177.73 67.88" fill="none" stroke="#9298b5" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M352 65 L368 65" fill="none" stroke="#9298b5" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M362.73 62.12 L368 65 L362.73 67.88" fill="none" stroke="#9298b5" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M537 65 L553 65" fill="none" stroke="#9298b5" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M547.73 62.12 L553 65 L547.73 67.88" fill="none" stroke="#9298b5" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M637.5 132 L637.5 192" fill="none" stroke="#9298b5" stroke-width="1.25" strok