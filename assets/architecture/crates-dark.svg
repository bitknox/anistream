<svg xmlns="http://www.w3.org/2000/svg" class="ani-arch-wide" width="768" height="734" viewBox="0 0 768 734" role="img" aria-labelledby="crates-dark-title crates-dark-desc"><title id="crates-dark-title">How the crates are layered, and the boundaries CI checks</title><desc id="crates-dark-desc">anistream-core, the types and traits, depends on no other crate. The lower crates, net, store, meta, providers, track, player and plugin, sit on the core. anistream-model, the commands, events, rows and wording a front end shares with the engine, depends on the core only. anistream-engine depends on the model and the lower crates; its desktop feature holds mpv, watch parties, the browser sign-in and notifications. anistream-tui, the terminal front end, depends on the model and the core and never on the engine. The anistream binary connects the terminal front end to the engine. anistream-ffi carries the engine to the native apps through UniFFI: SwiftUI on Apple, Compose on Android and WinUI 3 on Windows. The Linux app, in Rust, links the engine itself. tools/check-boundaries.sh checks in CI that the engine, the model, anistream-ffi and every crate under them reach no terminal library, that anistream-tui never depends on anistream-engine, and that the engine and anistream-ffi built for iOS or Android without the desktop feature reach no anistream-player, open or keyring.</desc><rect width="768" height="734" rx="16" fill="#161a2e"/><g transform="translate(24 24)"><rect x="0.5" y="0.5" width="219" height="89" rx="10" fill="#222638" stroke="#434653" stroke-width="1"/><text x="14" y="27" text-anchor="start" fill="#e4e0d6" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="600">anistream</text><text x="14" y="49" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="400">the binary: command line,</text><text x="14" y="67" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="400">event loop and self-update</text><rect x="260.5" y="0.5" width="219" height="89" rx="10" fill="#222638" stroke="#434653" stroke-width="1"/><text x="274" y="27" text-anchor="start" fill="#e4e0d6" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="600">anistream-ffi</text><text x="274" y="49" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="400">the engine for native front</text><text x="274" y="67" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="400">ends, through UniFFI</text><rect x="520.5" y="0.5" width="199" height="89" rx="10" fill="none" stroke="#434653" stroke-width="1" stroke-dasharray="4 3"/><text x="534" y="29" text-anchor="start" fill="#e4e0d6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="14" font-weight="600">Native apps</text><text x="534" y="49" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="400">SwiftUI, Compose</text><text x="534" y="67" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="400">and WinUI 3</text><path d="M518 45 L482 45" fill="none" stroke="#9298b5" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M487.27 47.88 L482 45 L487.27 42.12" fill="none" stroke="#9298b5" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><rect x="0.5" y="146.5" width="219" height="107" rx="10" fill="#222638" stroke="#434653" stroke-width="1"/><text x="14" y="173" text-anchor="start" fill="#e4e0d6" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="600">anistream-tui</text><text x="14" y="195" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="400">the terminal’s screens,</text><text x="14" y="213" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="400">keymap and theme,</text><text x="14" y="231" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="400">on ratatui</text><rect x="260.5" y="146.5" width="459" height="107" rx="10" fill="#222638" stroke="#434653" stroke-width="1"/><text x="274" y="173" text-anchor="start" fill="#e4e0d6" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="600">anistream-engine</text><text x="274" y="195" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="400">playback, sources and</text><text x="274" y="213" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="400">plugins, sync, downloads,</text><text x="274" y="231" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="400">plugin stores, background jobs</text><rect x="494.5" y="158.5" width="211" height="83" rx="10" fill="none" stroke="#434653" stroke-width="1" stroke-dasharray="4 3"/><text x="506" y="182" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="12" font-weight="500" letter-spacing="0.06em">DESKTOP FEATURE</text><text x="506" y="203" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="400">mpv, watch parties, the</text><text x="506" y="221" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="400">browser sign-in, notifications</text><path d="M240 146 L240 186" fill="none" stroke="#f2a64b" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M240 210 L240 254" fill="none" stroke="#f2a64b" stroke-width="1.5" stroke-dasharray="4 3"/><text x="240" y="202" text-anchor="middle" fill="#f2a64b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="12" font-weight="500">never</text><path d="M80 92 L80 144" fill="none" stroke="#9298b5" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M82.88 138.73 L80 144 L77.12 138.73" fill="none" stroke="#9298b5" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 92 L180 112 L300 112 L300 144" fill="none" stroke="#9298b5" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M302.88 138.73 L300 144 L297.12 138.73" fill="none" stroke="#9298b5" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M400 92 L400 144" fill="none" stroke="#9298b5" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M402.88 138.73 L400 144 L397.12 138.73" fill="none" stroke="#9298b5" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><rect x="24.5" y="310.5" width="195" height="89" rx="10" fill="#222638" stroke="#434653" stroke-width="1"/><text x="38" y="337" text-anchor="start" fill="#e4e0d6" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="600">anistream-model</text><text x="38" y="359" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="400">commands, events, rows</text><text x="38" y="377" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="400">and wording; no I/O</text><rect x="260.5" y="310.5" width="459" height="89" rx="10" fill="#222638" stroke="#434653" stroke-width="1"/><text x="274" y="336" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="12" font-weight="500" letter-spacing="0.06em">LOWER CRATES</text><text x="706" y="336" text-anchor="end" fill="#9298b5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400">anistream-*</text><rect x="274.5" y="352.5" width="37" height="23" rx="6" fill="#161a2e" stroke="#434653" stroke-width="1"/><text x="293" y="368" text-anchor="middle" fill="#e4e0d6" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400">net</text><rect x="318.5" y="352.5" width="52" height="23" rx="6" fill="#161a2e" stroke="#434653" stroke-width="1"/><text x="344.5" y="368" text-anchor="middle" fill="#e4e0d6" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400">store</text><rect x="377.5" y="352.5" width="44" height="23" rx="6" fill="#161a2e" stroke="#434653" stroke-width="1"/><text x="399.5" y="368" text-anchor="middle" fill="#e4e0d6" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-