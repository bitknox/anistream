L490 308 L487.12 302.73" fill="none" stroke="#9298b5" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><rect x="0.5" y="448.5" width="719" height="67" rx="10" fill="#222638" stroke="#434653" stroke-width="1"/><text x="14" y="475" text-anchor="start" fill="#e4e0d6" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="600">anistream-core</text><text x="14" y="497" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="400">types and traits; depends on no other crate</text><path d="M10 256 L10 446" fill="none" stroke="#9298b5" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.88 440.73 L10 446 L7.12 440.73" fill="none" stroke="#9298b5" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M120 402 L120 446" fill="none" stroke="#9298b5" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M122.88 440.73 L120 446 L117.12 440.73" fill="none" stroke="#9298b5" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M490 402 L490 446" fill="none" stroke="#9298b5" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M492.88 440.73 L490 446 L487.12 440.73" fill="none" stroke="#9298b5" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="562" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="400">Checked in CI by tools/check-boundaries.sh, against the resolved dependency tree:</text><text x="0" y="588" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="600">1</text><text x="20" y="588" text-anchor="start" fill="#e4e0d6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="400">The engine, the model, anistream-ffi and every crate under them reach no terminal library,</text><text x="20" y="608" text-anchor="start" fill="#e4e0d6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="400">not even through a dependency.</text><text x="0" y="634" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="600">2</text><text x="20" y="634" text-anchor="start" fill="#e4e0d6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="400">anistream-tui depends on the model and the core, never on the engine.</text><text x="0" y="660" text-anchor="start" fill="#9298b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="600">3</text><text x="20" y="660" text-anchor="start" fill="#e4e0d6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="400">Built for iOS or Android without desktop, the engine and anistream-ffi reach no</text><text x="20" y="680" text-anchor="start" fill="#e4e0d6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif" font-size="13" font-weight="400">anistream-player, open or keyring.</text></g></svg>
