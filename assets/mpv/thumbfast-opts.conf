# thumbfast options anistream passes, one --script-opts-append=thumbfast-<key>=<value> each.
# Format: key=value per line; lines starting with # are comments. spawn_first and hwdec
# repeat thumbfast's defaults, so an upstream change of default cannot change them here.

# Every anistream stream is network playback, the torrent's local HTTP server included, and
# thumbfast refuses network files by default.
network=yes

# Spawning on file load would open a second connection to the source while the main player
# is still filling its first buffer, which is when the viewer is waiting. Waiting for the
# first seekbar hover also gives the host time to set user-data/anistream/thumbnail-url.
spawn_first=no

# Software decoding of one keyframe at a time is fast, and a second hardware decoder session
# beside the main player's fails outright on some drivers.
hwdec=no

# A 16:9 box, so an anime frame fills it with no bars; big enough to recognise a scene
# without covering much of the picture. thumbfast multiplies it by the display's HiDPI
# factor itself, as uosc does its controls.
max_width=256
max_height=144

# mpv_path is not set here: thumbfast looks the running mpv up from its pid on macOS and
# runs "mpv" from PATH elsewhere. A host launching an mpv that is not "mpv" on PATH passes
# thumbfast-mpv_path=<that binary> alongside these.
