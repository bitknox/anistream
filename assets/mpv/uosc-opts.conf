# uosc in anistream mode. The host passes each line as --script-opts-append=uosc-<key>=<value>,
# so: one key=value per line, no quoting, commas stay inside the value. Written against uosc
# 5.13.0; every key below exists in that version's option table.
#
# uosc supplies the control row's buttons and their tooltips. The seek bar, the volume, the
# menus and every card are drawn by the companion script (scripts/anistream), which is why the
# timeline and volume are switched off here: uosc draws its seek bar exactly as thick as it can
# be grabbed, prints the time inside it, and paints its fills in the same colour as its icons.
# At rest nothing of either is on screen; both come up when the pointer moves, the video pauses
# or a seek lands, and leave together with the cursor.

# Our seek bar replaces uosc's; the loading card replaces its idle indicator.
disable_elements=timeline,idle_indicator
# Play/pause leads on the left (the companion's volume and time follow it); subtitles, audio,
# episodes, the menu and fullscreen sit on the right and open the companion's own menus. No
# button has an active state, so none ever turns into a filled block.
controls=play-pause,space,<video,audio>command:subtitles:script-binding anistream/subtitles?Subtitles,<has_many_audio>command:graphic_eq:script-binding anistream/audio?Audio,command:list_alt:script-binding anistream/episodes?Episodes,command:menu:script-binding anistream/menu?Menu,cycle:crop_free:fullscreen:no/yes=fullscreen_exit?Fullscreen
# A 32 px click target per button; the drawn icon is 70% of that.
controls_size=32
controls_spacing=8
# The companion draws the volume in the control row (thin track, amber level, mute on the
# speaker) instead of uosc's tall slab of a slider.
volume=none
# The window title already says what is playing.
top_bar=never
# Nothing pinned to the bottom edge while the controls are hidden.
progress=never
# No play/pause glyph over the picture.
pause_indicator=manual
# Hide with the cursor, so a pointer parked over the row does not pin it.
autohide=yes
# How long a flash keeps the row up: mpv's default cursor-hide delay, so they leave together.
flash_duration=1000
# Fades in the 120-180 ms range.
animation_duration=150
# A one-pixel dark edge on icons keeps them legible on a white frame.
text_border=1

# Obi & Silk. Icons are silk: uosc paints icons and progress with the one foreground colour, and
# amber is kept for the companion's seek bar fill and the obi. Dusk indigo is the background,
# water and vermilion carry success and error.
color=foreground=e4e0d6,foreground_text=161a2e,background=161a2e,background_text=e4e0d6,curtain=161a2e,success=7fc7d9,error=e06b54,match=7fc7d9,window_border=161a2e
# Flat ground under tooltips at the companion's panel opacity.
opacity=tooltip=0.88,curtain=0.5

# Openings and endings as a water tint, should uosc's own timeline be switched back on. The
# companion's seek bar tints the same chapter names. uosc already knows OP/ED/Opening/Ending;
# these add NCOP/NCED, Intro, Outro and Credits (the names skip.rs and release files use) and
# keep the Japanese titles uosc matches by default. Patterns are Lua, against lowercased titles.
chapter_ranges=openings:7fc7d973,endings:7fc7d973
chapter_range_patterns=openings:オープニング,^ncop,^intro$;endings:エンディング,^nced,^outro$,^credits
