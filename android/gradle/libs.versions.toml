# Every version the Android app builds with, pinned. Each was the latest stable release on
# 2026-10-21.
[versions]
agp = "9.4.1"
kotlin = "2.4.21"
compose-bom = "2026.09.00"
# Not the 1.4.0 the BOM picks: in that stable release the Expressive APIs the design is built on
# (MaterialExpressiveTheme, MotionScheme, ShortNavigationBar, LargeFlexibleTopAppBar, ButtonGroup)
# are internal. 1.5.0-beta01 is the newest release that has them, on the BOM's Compose 1.12.
material3 = "1.5.0-beta01"
# ListDetailPaneScaffold, for the tablets' list and detail.
adaptive = "1.3.0"
activity = "1.13.0"
lifecycle = "2.11.0"
zxing = "3.5.4"
tvprovider = "1.1.0"
# Installs the TV app's baseline profile on a sideloaded build, where no store compiles it.
profileinstaller = "1.4.1"
navigation = "2.10.2"
core = "1.19.1"
annotation = "1.11.0"
coroutines = "1.11.0"
media3 = "1.11.1"
# Custom Tabs, for AniList's and MyAnimeList's sign-in.
browser = "1.10.0"
# The trailers' web view: a message listener limited to the app's origin.
webkit = "1.18.0"
# The periodic check for new episodes.
work = "2.12.0"
# The home-screen widgets, Continue watching and Airing today.
glance = "1.2.0"
# 5.17 is the first with 16 KB aligned Android libraries.
jna = "5.19.1"
junit = "4.13.2"
# The screens' JVM screenshot tests: Robolectric's native graphics, and Roborazzi to capture them.
robolectric = "4.17"
roborazzi = "1.76.0"
# The scenes the screenshot tests replay, recorded from the engine as JSON.
kotlinx-serialization = "1.12.0"
# The NDK the APK's native libraries are stripped with: the one android/scripts/engine.sh builds with.
ndk = "30.0.16248370"
# What builds the player's JNI shim.
cmake = "4.1.2"
androidx-test-runner = "1.7.0"
androidx-test-junit = "1.3.0"
# The feature videos' flows (website/scripts/videos), driving the apps as a person does.
androidx-test-uiautomator = "2.4.0"
# Compose for TV's components: the navigation drawer, cards, buttons, tabs, chips and lists the TV
# app is built from. Its lazy layouts were removed; rows and grids are Compose foundation's.
tv-material = "1.1.0"

[libraries]
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
adaptive-layout = { module = "androidx.compose.material3.adaptive:adaptive-layout", version.ref = "adaptive" }
adaptive-navigation = { module = "androidx.compose.material3.adaptive:adaptive-navigation", version.ref = "adaptive" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
tvprovider = { module = "androidx.tvprovider:tvprovider", version.ref = "tvprovider" }
profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
# What the bindings' Android cleaner is annotated with.
annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
browser = { module = "androidx.browser:browser", version.ref = "browser" }
webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
work-testing = { module = "androidx.work:work-testing", version.ref = "work" }
glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
glance-appwidget-testing = { module = "androidx.glance:glance-appwidget-testing", version.ref = "glance" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
# The Android build, its native libraries for every ABI inside the AAR.
jna-aar = { module = "net.java.dev.jna:jna", version.ref = "jna" }
# The JVM build, with this Mac's native library, for the unit tests.
jna-jvm = { module = "net.java.dev.jna:jna", version.ref = "jna" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidx-test-uiautomator" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-gradle-plugin = { module = "io.github.takahirom.roborazzi:roborazzi-gradle-plugin", version.ref = "roborazzi" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
tv-material = { module = "androidx.tv:tv-material", version.ref = "tv-material" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
